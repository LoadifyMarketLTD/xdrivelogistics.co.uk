name: Apply workspace location type hotfix

on:
  push:
    branches:
      - hotfix/restore-workspace-location-job-id-type-2026-07-20
    paths:
      - .github/workflows/apply-workspace-location-type-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/restore-workspace-location-job-id-type-2026-07-20
          fetch-depth: 0

      - name: Restore compatibility field without querying the missing column
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/components/workspace/useCompanyWorkspaceData.ts')
          text = path.read_text(encoding='utf-8')

          old = """export type WorkspaceLocation = {
            id: string;
            driver_id: string;
            lat: number;
            lng: number;
            recorded_at?: string | null;
            updated_at?: string | null;
          };
          """
          new = """export type WorkspaceLocation = {
            id: string;
            driver_id: string;
            job_id?: string | null;
            lat: number;
            lng: number;
            recorded_at?: string | null;
            updated_at?: string | null;
          };
          """

          if old not in text:
              raise SystemExit('WorkspaceLocation shape was not found; refusing a partial patch.')

          text = text.replace(old, new, 1)

          forbidden_query = ".select('id, driver_id, job_id, lat, lng, recorded_at, updated_at')"
          if forbidden_query in text:
              raise SystemExit('The runtime query still requests driver_locations.job_id; refusing to commit.')

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-workspace-location-type-hotfix.yml

      - name: Commit compatibility hotfix
        shell: bash
        run: |
          git config user.name "xdrive-hotfix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/workspace/useCompanyWorkspaceData.ts .github/workflows/apply-workspace-location-type-hotfix.yml
          git commit -m "Restore WorkspaceLocation job_id compatibility type"
          git push origin HEAD:hotfix/restore-workspace-location-job-id-type-2026-07-20
