name: Visual Fixture Gate

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: visual-fixture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace-visual-fixture-gate:
    name: Workspace Visual Fixture Gate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      E2E_VISUAL_FIXTURE: "true"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      EXPECTED_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || '' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || '' }}
      E2E_BROKER_EMAIL: ${{ secrets.E2E_BROKER_EMAIL || '' }}
      E2E_BROKER_PASSWORD: ${{ secrets.E2E_BROKER_PASSWORD || '' }}
      E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL || '' }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD || '' }}
      E2E_DRIVER_EMAIL: ${{ secrets.E2E_DRIVER_EMAIL || '' }}
      E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD || '' }}
      E2E_CARRIER_EMAIL: ${{ secrets.E2E_CARRIER_EMAIL || '' }}
      E2E_CARRIER_PASSWORD: ${{ secrets.E2E_CARRIER_PASSWORD || '' }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL || '' }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run workspace visual route proof gate
        run: npx playwright test e2e/workspace-visual-auth-gate.spec.ts e2e/jobs-visual-gate.spec.ts e2e/operations-centre-layout.spec.ts --project=chromium --reporter=html

      - name: Upload Playwright visual gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-visual-fixture-gate-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/**
            test-results/**
