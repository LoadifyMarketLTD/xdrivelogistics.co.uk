name: Patch Company Registration Hardening

on:
  push:
    branches:
      - fix/atomic-company-registration-only
    paths:
      - ".github/workflows/patch-company-registration-hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-company-registration-only
          fetch-depth: 0

      - name: Require live registry verification for legacy reuse
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registration = Path('supabase/migrations/20260723205000_atomic_authenticated_company_registration.sql')
          text = registration.read_text(encoding='utf-8')
          start_marker = """-- Safely claim existing company numbers only when there is one unambiguous company
          -- and one identifiable owner/creator. Legacy duplicates remain unclaimed and are
          -- rejected by the registration RPC until an administrator resolves them.
          WITH normalized_companies AS ("""
          end_marker = """ON CONFLICT DO NOTHING;

          DROP FUNCTION IF EXISTS public.register_validated_company_atomic(uuid, text, text, text, text);"""
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end < start:
              raise SystemExit('Expected unsafe legacy claim backfill block not found')
          replacement = """-- Existing companies are deliberately not marked as verified from local data.
          -- Their creator must pass a fresh server-side Companies House check before the
          -- first claim is created. This prevents a stale or dissolved legacy company
          -- from being treated as an active registry identity.

          DROP FUNCTION IF EXISTS public.register_validated_company_atomic(uuid, text, text, text, text);"""
          text = text[:start] + replacement + text[end + len(end_marker):]
          registration.write_text(text, encoding='utf-8', newline='\n')

          guard = Path('supabase/migrations/20260723205100_require_verified_company_onboarding.sql')
          guard_text = guard.read_text(encoding='utf-8')
          old_condition = """  IF NEW.account_type IN ('broker_shipper', 'fleet_courier')
             AND OLD.status IN ('draft', 'in_progress', 'request_changes')
             AND NEW.status IN ('submitted', 'under_review', 'approved') THEN"""
          new_condition = """  IF NEW.account_type IN ('broker_shipper', 'fleet_courier')
             AND NEW.status IN ('submitted', 'under_review', 'approved') THEN"""
          if old_condition not in guard_text:
              raise SystemExit('Expected onboarding claim guard condition not found')
          guard.write_text(guard_text.replace(old_condition, new_condition, 1), encoding='utf-8', newline='\n')

          test = Path('scripts/validate_atomic_company_registration.sh')
          test_text = test.read_text(encoding='utf-8')
          old_users = """  ('00000000-0000-0000-0000-000000000001', 'owner-a@example.com'),
            ('00000000-0000-0000-0000-000000000002', 'owner-b@example.com'),
            ('00000000-0000-0000-0000-000000000003', 'owner-c@example.com');
          INSERT INTO public.profiles (user_id) SELECT id FROM auth.users;"""
          new_users = """  ('00000000-0000-0000-0000-000000000001', 'owner-a@example.com'),
            ('00000000-0000-0000-0000-000000000002', 'owner-b@example.com'),
            ('00000000-0000-0000-0000-000000000003', 'owner-c@example.com'),
            ('00000000-0000-0000-0000-000000000004', 'owner-d@example.com');
          INSERT INTO public.profiles (user_id) SELECT id FROM auth.users;
          INSERT INTO public.companies (id, name, company_number, status, company_type, created_by)
          VALUES (
            '20000000-0000-0000-0000-000000000004',
            'Legacy Verified Later Limited',
            'NI765432',
            'pending_approval',
            'carrier',
            '00000000-0000-0000-0000-000000000004'
          );"""
          if old_users not in test_text:
              raise SystemExit('Expected test users fixture not found')
          test_text = test_text.replace(old_users, new_users, 1)

          old_declarations = """  takeover_result record;
            registered_company_id uuid;"""
          new_declarations = """  takeover_result record;
            legacy_result record;
            registered_company_id uuid;"""
          if old_declarations not in test_text:
              raise SystemExit('Expected test declaration block not found')
          test_text = test_text.replace(old_declarations, new_declarations, 1)

          insertion_point = """  IF takeover_result.success OR takeover_result.error_code <> 'COMPANY_ALREADY_REGISTERED' THEN
              RAISE EXCEPTION 'Takeover attempt was not rejected: %', row_to_json(takeover_result);
            END IF;

          """
          legacy_test = """  IF takeover_result.success OR takeover_result.error_code <> 'COMPANY_ALREADY_REGISTERED' THEN
              RAISE EXCEPTION 'Takeover attempt was not rejected: %', row_to_json(takeover_result);
            END IF;

            SELECT * INTO legacy_result
            FROM public.register_validated_company_atomic(
              '00000000-0000-0000-0000-000000000004',
              'NI765432',
              'Legacy Verified Later Limited',
              'active',
              'fleet_courier'
            );

            IF NOT legacy_result.success OR legacy_result.created
               OR legacy_result.company_id <> '20000000-0000-0000-0000-000000000004'::uuid THEN
              RAISE EXCEPTION 'Verified legacy reuse failed: %', row_to_json(legacy_result);
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM public.company_registration_claims
              WHERE company_number = 'NI765432'
                AND company_id = '20000000-0000-0000-0000-000000000004'::uuid
                AND claimed_by = '00000000-0000-0000-0000-000000000004'::uuid
            ) THEN
              RAISE EXCEPTION 'Verified legacy reuse did not create a registry claim.';
            END IF;

          """
          if insertion_point not in test_text:
              raise SystemExit('Expected takeover assertion block not found')
          test_text = test_text.replace(insertion_point, legacy_test, 1)
          test.write_text(test_text, encoding='utf-8', newline='\n')
          PY

      - name: Commit focused hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xdrive-company-registration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            supabase/migrations/20260723205000_atomic_authenticated_company_registration.sql \
            supabase/migrations/20260723205100_require_verified_company_onboarding.sql \
            scripts/validate_atomic_company_registration.sh
          git commit -m "fix(company-registration): require live verification for legacy claims"
          git push origin HEAD:fix/atomic-company-registration-only
