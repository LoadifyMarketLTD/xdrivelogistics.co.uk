name: Validate Atomic Company Registration

on:
  pull_request:
    paths:
      - "app/actions/companies.ts"
      - "app/api/onboarding/_lib/handlers.ts"
      - "lib/server/companyRegistration.ts"
      - "supabase/migrations/20260723205000_atomic_authenticated_company_registration.sql"
      - "supabase/migrations/20260723205100_require_verified_company_onboarding.sql"
      - "scripts/validate_atomic_company_registration.sh"
      - ".github/workflows/validate-atomic-company-registration.yml"
  push:
    branches:
      - fix/atomic-company-registration-only
    paths:
      - "app/actions/companies.ts"
      - "app/api/onboarding/_lib/handlers.ts"
      - "lib/server/companyRegistration.ts"
      - "supabase/migrations/20260723205000_atomic_authenticated_company_registration.sql"
      - "supabase/migrations/20260723205100_require_verified_company_onboarding.sql"
      - "scripts/validate_atomic_company_registration.sh"
      - ".github/workflows/validate-atomic-company-registration.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run atomic registration validation
        id: validation
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate_atomic_company_registration.sh 2>&1 | tee company-registration-validation.log

      - name: Publish focused failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostic="$(tail -n 80 company-registration-validation.log 2>/dev/null || echo 'Validation log was not created.')"
          body="$(printf '### Atomic company registration validation failed\n\n```text\n%s\n```' "$diagnostic")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
