name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    # Run when web or shared root files change.
    # Always runs on push to the default branch to keep the baseline green.
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.labels.*.name), 'scope:web') ||
      contains(toJson(github.event.pull_request.labels.*.name), 'scope:cross') ||
      (
        !contains(toJson(github.event.pull_request.labels.*.name), 'scope:expo') &&
        !contains(toJson(github.event.pull_request.labels.*.name), 'scope:android') &&
        !contains(toJson(github.event.pull_request.labels.*.name), 'scope:supabase')
      )
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        run: npm run lint

      - name: Typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        run: npm run typecheck

      - name: Unit tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        run: npm run test:unit

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        run: npm run build

  public-e2e-smoke:
    name: Public E2E Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      EXPECTED_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run stable public smoke tests (chromium)
        run: npx playwright test e2e/ci-public-smoke.spec.ts --project=chromium

      - name: Run stable public smoke tests (mobile-safari)
        run: npx playwright test e2e/ci-public-smoke.spec.ts --project=mobile-safari

  detect-expo-driver-changes:
    name: Detect Expo Driver Changes
    runs-on: ubuntu-latest
    outputs:
      driver_changed: ${{ steps.scope.outputs.driver_changed }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect driver-mobile path changes
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "driver_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -Eq '^apps/driver-mobile/'; then
            echo "driver_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "driver_changed=false" >> "$GITHUB_OUTPUT"
          fi

  expo-driver-typecheck:
    name: Expo Driver Typecheck
    runs-on: ubuntu-latest
    needs: detect-expo-driver-changes
    # Mobile validation must not block website-only branches, but it must run
    # whenever driver-mobile files actually change even if scope labels are absent.
    if: |
      needs.detect-expo-driver-changes.outputs.driver_changed == 'true' ||
      contains(toJson(github.event.pull_request.labels.*.name), 'scope:expo') ||
      contains(toJson(github.event.pull_request.labels.*.name), 'scope:android') ||
      contains(toJson(github.event.pull_request.labels.*.name), 'scope:cross')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Expo driver dependencies
        working-directory: apps/driver-mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck Expo driver
        working-directory: apps/driver-mobile
        run: npm run typecheck

      - name: Test Expo driver
        working-directory: apps/driver-mobile
        run: npm run test

  codeql-web:
    name: CodeQL Security Scan (javascript-typescript,actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,actions
          queries: security-extended
          build-mode: none

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  codeql-mobile:
    name: CodeQL Security Scan (java-kotlin)
    runs-on: ubuntu-latest
    # Android/Kotlin scanning belongs to mobile or cross-scope PRs, while main
    # keeps the complete protected baseline.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(toJson(github.event.pull_request.labels.*.name), 'scope:expo') ||
          contains(toJson(github.event.pull_request.labels.*.name), 'scope:android') ||
          contains(toJson(github.event.pull_request.labels.*.name), 'scope:cross')
        )
      )
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
