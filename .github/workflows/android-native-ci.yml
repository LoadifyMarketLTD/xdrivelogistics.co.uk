name: Android Native CI

on:
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-ci.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.repair.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-driver-tracking-only
          fetch-depth: 0
      - id: repair
        name: Fix permission lint and stale lifecycle helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('android-native/app/src/main/java/co/uk/xdrivelogistics/driver/MainActivity.kt')
          text = main.read_text()
          if 'import android.annotation.SuppressLint\n' not in text:
              text = text.replace(
                  'package co.uk.xdrivelogistics.driver\n\n',
                  'package co.uk.xdrivelogistics.driver\n\nimport android.annotation.SuppressLint\n',
                  1,
              )
          if '@SuppressLint("MissingPermission")\n    override fun onCreate' not in text:
              text = text.replace(
                  '    override fun onCreate(savedInstanceState: Bundle?) {',
                  '    @SuppressLint("MissingPermission")\n    override fun onCreate(savedInstanceState: Bundle?) {',
                  1,
              )

          obsolete_status_helpers = '''private fun DriverJob.statusKey(): String = currentStatus.ifBlank { status }.lowercase()

private fun DriverJob.driverStatusKey(): String =
    when (statusKey()) {
        "collected" -> "loaded"
        "in_transit" -> "on_site_delivery"
        else -> statusKey()
    }

private fun DriverJob.isInProgress(): Boolean =
    driverStatusKey() in listOf("on_my_way", "on_site_pickup", "loaded", "on_site_delivery", "in_progress")

private fun DriverJob.isActive(): Boolean = driverStatusKey() !in listOf("delivered", "completed", "cancelled", "canceled")

private fun DriverJob.hasPod(): Boolean = podPhotos.isNotEmpty() || deliveryPhotos.isNotEmpty()

private fun DriverJob.isPosted(): Boolean = driverStatusKey() == "posted"

private fun DriverJob.routeLabel(): String = "${pickupLocation.ifBlank { "Pickup" }} -> ${deliveryLocation.ifBlank { "Delivery" }}"

private fun DriverJob.statusLabel(): String = driverStatusKey().statusLabel()

'''
          text = text.replace(obsolete_status_helpers, '', 1)

          obsolete_action_helpers = '''private fun DriverJob.nextStatus(): String = when (driverStatusKey()) {
    "allocated" -> "on_my_way"
    "on_my_way" -> "on_site_pickup"
    "on_site_pickup" -> "loaded"
    "loaded" -> "on_site_delivery"
    "on_site_delivery" -> "delivered"
    "delivered" -> "completed"
    else -> ""
}

private fun DriverJob.nextActionLabel(): String = when (nextStatus()) {
    "on_my_way" -> "On My Way"
    "on_site_pickup" -> "Arrived at Collection"
    "loaded" -> "Loaded / Collected"
    "on_site_delivery" -> "Arrived at Delivery"
    "delivered" -> "Mark as Delivered"
    "completed" -> "Complete Job"
    else -> "No further action"
}

private fun DriverJob.canMoveNext(): Boolean =
    nextStatus().isNotBlank() && (nextStatus() != "delivered" || hasPod())

'''
          text = text.replace(obsolete_action_helpers, '', 1)
          main.write_text(text)

          tracking = Path('android-native/app/src/main/java/co/uk/xdrivelogistics/driver/TrackingService.kt')
          text = tracking.read_text()
          if 'import android.annotation.SuppressLint\n' not in text:
              text = text.replace(
                  'package co.uk.xdrivelogistics.driver\n\n',
                  'package co.uk.xdrivelogistics.driver\n\nimport android.annotation.SuppressLint\n',
                  1,
              )
          if '@SuppressLint("MissingPermission")\n    private suspend fun captureCurrentLocation' not in text:
              text = text.replace(
                  '    private suspend fun captureCurrentLocation(): PendingLocation? = runCatching {',
                  '    @SuppressLint("MissingPermission")\n    private suspend fun captureCurrentLocation(): PendingLocation? = runCatching {',
                  1,
              )
          if '@SuppressLint("MissingPermission")\n    private fun updateNotification' not in text:
              text = text.replace(
                  '    private fun updateNotification(title: String, text: String, ongoing: Boolean) {',
                  '    @SuppressLint("MissingPermission")\n    private fun updateNotification(title: String, text: String, ongoing: Boolean) {',
                  1,
              )
          tracking.write_text(text)
          PY

          if git diff --quiet -- android-native; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "xdrive-automation"
          git config user.email "actions@users.noreply.github.com"
          git add android-native/app/src/main/java/co/uk/xdrivelogistics/driver/MainActivity.kt \
                  android-native/app/src/main/java/co/uk/xdrivelogistics/driver/TrackingService.kt
          git commit -m "Fix Android permission lint and remove stale lifecycle helpers"
          git push origin HEAD:fix/android-driver-tracking-only
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: repair
    if: needs.repair.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build, lint and unit test native driver app
        working-directory: android-native
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug 2>&1 | tee /tmp/android-gradle-build.log
      - name: Publish focused build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          diagnostic="$(tail -n 180 /tmp/android-gradle-build.log)"
          body="$(printf '### Android native build failure\n\n```text\n%s\n```' "$diagnostic")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
      - name: Create APK checksum
        working-directory: android-native
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xdrive-driver-debug-${{ github.sha }}
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  instrumented:
    needs: repair
    if: needs.repair.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 14 emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android-native && chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
