name: Validate Notification Recipient Isolation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260723222000_notification_recipient_isolation.sql"
      - "supabase/tests/notification_recipient_isolation.sql"
      - "scripts/validate_notification_recipient_isolation.sh"
      - ".github/workflows/validate-notification-recipient-isolation.yml"
  push:
    branches:
      - fix/notification-recipient-isolation-only
    paths:
      - "supabase/migrations/20260723222000_notification_recipient_isolation.sql"
      - "supabase/tests/notification_recipient_isolation.sql"
      - "scripts/validate_notification_recipient_isolation.sh"
      - ".github/workflows/validate-notification-recipient-isolation.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate private-recipient and company-broadcast isolation
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate_notification_recipient_isolation.sh 2>&1 | tee notification-recipient-isolation.log

      - name: Publish focused failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostic="$(tail -n 100 notification-recipient-isolation.log 2>/dev/null || echo 'Validation log was not created.')"
          body="$(printf '### Notification recipient isolation validation failed\n\n```text\n%s\n```' "$diagnostic")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
