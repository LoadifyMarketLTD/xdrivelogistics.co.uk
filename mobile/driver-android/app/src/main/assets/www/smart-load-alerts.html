<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDrive Driver - Smart Load Alerts</title><link rel="stylesheet" href="styles.css"></head><body class="live-hydrate">
<main class="app-shell"><section class="phone"><header class="topbar"><a class="back" href="more.html">&#8592;</a><div class="top-title">Smart Load Alerts</div><div></div></header>
<section class="screen detail-screen"><div class="panel"><div class="panel-title">Matching</div>
<label class="post-check"><input id="slaEnabled" type="checkbox"> Enable Smart Load Alerts</label>
<label class="post-check"><input id="slaCurrent" type="checkbox"> Current location radius</label>
<label class="field-label">Radius miles</label><input id="slaRadius" class="form-input" type="number" min="5" max="300" value="30">
<label class="field-label">Current location max age (minutes)</label><input id="slaAge" class="form-input" type="number" min="15" max="360" value="120">
<label class="post-check"><input id="slaHomeEnabled" type="checkbox"> Home outcode</label><input id="slaHome" class="form-input" placeholder="e.g. BB1">
<label class="post-check"><input id="slaFuture" type="checkbox"> Use Future Position</label>
<label class="post-check"><input id="slaVehicle" type="checkbox"> Require vehicle match</label>
<label class="field-label">Minimum budget (£)</label><input id="slaBudget" class="form-input" type="number" min="0" step="0.01" placeholder="No minimum">
</div><div class="panel"><div class="panel-title">Notification channels</div>
<label class="post-check"><input id="slaInApp" type="checkbox"> In-app</label><label class="post-check"><input id="slaEmail" type="checkbox"> Email</label><label class="post-check"><input id="slaPush" type="checkbox"> Push</label>
<button id="slaSave" class="primary">Save Smart Load Alerts</button><div id="slaMsg" class="save-note"></div></div>
<div class="panel"><div class="panel-title">Context</div><div id="slaContext" class="details">Loading…</div></div></section>
<nav class="bottom-nav"><a class="nav-item" href="index.html"><span>&#8962;</span><small>Loads</small></a><a class="nav-item" href="alerts.html"><span>&#9671;</span><small>Alerts</small></a><a class="nav-item" href="quote.html"><span>&#9670;</span><small>My Quotes</small></a><a class="nav-item" href="bookings.html"><span>&#9635;</span><small>Bookings</small></a><a class="nav-item active" href="more.html"><span>&#8226;&#8226;&#8226;</span><small>More</small></a></nav></section></main>
<script src="real-data.js"></script><script src="smart-load-alerts.js"></script><script src="theme.js"></script></body></html>
