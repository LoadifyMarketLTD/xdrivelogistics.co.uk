<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDrive Driver - Login</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="app-shell"><section class="phone"><header class="more-hero"><div class="more-eyebrow">XDRIVE DRIVER</div><h1>Sign in</h1><p>Secure driver access</p></header>
<section class="screen"><form id="login-form" class="panel" style="margin-top:20px"><label class="field-label">Email</label><input id="login-email" class="form-input" type="email" autocomplete="username" required><label class="field-label">Password</label><input id="login-password" class="form-input" type="password" autocomplete="current-password" required><button id="login-submit" class="primary" type="submit">Sign In</button><div id="login-message" class="save-note">Use your XDrive driver account.</div></form></section></section></main>
<script>
const form=document.getElementById('login-form'),msg=document.getElementById('login-message'),btn=document.getElementById('login-submit');
function errorText(body){return body&&typeof body==='object'?(body.error||body.msg||body.message||'Sign in failed.'):String(body||'Sign in failed.');}
form.addEventListener('submit',e=>{e.preventDefault();msg.textContent='Signing in...';btn.disabled=true;try{if(!window.XDriveNative||typeof XDriveNative.signIn!=='function')throw new Error('Native login service is unavailable.');const r=JSON.parse(XDriveNative.signIn(document.getElementById('login-email').value.trim(),document.getElementById('login-password').value)||'{}');if(Number(r.status)>=200&&Number(r.status)<300){localStorage.clear();sessionStorage.clear();location.replace('app-shell.html');return;}msg.textContent=errorText(r.body);}catch(err){msg.textContent=err&&err.message?err.message:'Sign in failed.';}finally{btn.disabled=false;}});
</script><script src="theme.js"></script></body></html>
