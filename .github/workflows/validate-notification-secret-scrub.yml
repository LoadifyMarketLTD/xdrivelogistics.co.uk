name: Validate Notification Secret Scrub

on:
  pull_request:
    paths:
      - "supabase/functions/notify-operational-event/index.ts"
      - "supabase/migrations/20260721223500_scrub_notification_secrets.sql"
      - ".github/workflows/validate-notification-secret-scrub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-secrets:
    name: Apply scrub migration twice and verify terminal events
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdrive_notification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xdrive_notification_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: xdrive_notification_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create notification fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;

          CREATE TABLE public.notification_events (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            event_type text NOT NULL,
            entity_type text NOT NULL,
            entity_id uuid NOT NULL,
            payload jsonb NOT NULL DEFAULT '{}'::jsonb,
            status text NOT NULL DEFAULT 'pending'
              CHECK (status IN ('pending', 'sent', 'failed', 'skipped')),
            created_at timestamptz NOT NULL DEFAULT now(),
            processed_at timestamptz
          );

          INSERT INTO public.notification_events (event_type, entity_type, entity_id, status, payload)
          VALUES
            ('onboarding_invite', 'onboarding_application', gen_random_uuid(), 'pending',
             '{"onboarding_url":"https://www.xdrivelogistics.co.uk/onboarding/secret-pending","token":"pending-token","keep":"pending"}'),
            ('onboarding_invite', 'onboarding_application', gen_random_uuid(), 'failed',
             '{"onboarding_url":"https://www.xdrivelogistics.co.uk/onboarding/secret-failed","raw_token":"failed-token","keep":"failed"}'),
            ('onboarding_invite', 'onboarding_application', gen_random_uuid(), 'sent',
             '{"onboarding_url":"https://www.xdrivelogistics.co.uk/onboarding/secret-sent","onboarding_token":"sent-token","keep":"sent"}'),
            ('onboarding_invite', 'onboarding_application', gen_random_uuid(), 'skipped',
             '{"onboarding_url":"https://www.xdrivelogistics.co.uk/onboarding/secret-skipped","token":"skipped-token","keep":"skipped"}');
          SQL

      - name: Apply migration twice
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260721223500_scrub_notification_secrets.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260721223500_scrub_notification_secrets.sql

      - name: Exercise terminal transitions
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE public.notification_events
          SET status = 'sent'
          WHERE payload->>'keep' = 'pending';

          UPDATE public.notification_events
          SET status = 'skipped'
          WHERE payload->>'keep' = 'failed';
          SQL

      - name: Verify secrets are absent and non-secret payload is preserved
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM public.notification_events
              WHERE status IN ('sent', 'skipped')
                AND payload ?| ARRAY['onboarding_url', 'token', 'raw_token', 'onboarding_token']
            ) THEN
              RAISE EXCEPTION 'A terminal notification retained onboarding secrets.';
            END IF;

            IF (SELECT count(*) FROM public.notification_events WHERE payload ? 'keep') <> 4 THEN
              RAISE EXCEPTION 'Non-secret payload fields were removed.';
            END IF;

            IF EXISTS (
              SELECT 1 FROM public.notification_events
              WHERE payload::text LIKE '%secret-%'
                 OR payload::text LIKE '%-token%'
            ) THEN
              RAISE EXCEPTION 'Secret fixture content remains after terminal transitions.';
            END IF;
          END;
          $$;
          SQL
