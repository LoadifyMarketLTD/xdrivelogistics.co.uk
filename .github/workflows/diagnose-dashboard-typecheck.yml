name: Diagnose dashboard typecheck

on:
  push:
    branches:
      - agent/dashboard-consistency-overhaul

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-diagnostic-output]') }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dashboard-consistency-overhaul

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Capture typecheck
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          npm run typecheck > diagnostics/dashboard-typecheck.log 2>&1
          code=$?
          tail -n 200 diagnostics/dashboard-typecheck.log > diagnostics/dashboard-typecheck.tail
          echo "TYPECHECK_EXIT=$code" >> diagnostics/dashboard-typecheck.tail

      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name 'xdrive-ci-diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/dashboard-typecheck.tail
          git commit -m 'Capture dashboard typecheck output [dashboard-diagnostic-output]' || exit 0
          git push origin HEAD:agent/dashboard-consistency-overhaul
