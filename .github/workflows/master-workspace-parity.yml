name: Master Workspace Parity
on:
  pull_request:
    paths:
      - "app/try-xdrive-*/**"
      - "app/admin/page.tsx"
      - "app/broker/page.tsx"
      - "scripts/verify-master-workspace.mjs"
      - ".github/workflows/master-workspace-parity.yml"
  push:
    branches: [main]
    paths:
      - "app/try-xdrive-*/**"
      - "app/admin/page.tsx"
      - "app/broker/page.tsx"
      - "scripts/verify-master-workspace.mjs"
jobs:
  enforce-single-master:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify every role uses exactly one MasterWorkspace
        run: node scripts/verify-master-workspace.mjs
