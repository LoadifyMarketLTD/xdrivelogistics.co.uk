name: Validate Remote Staging Operational Journey

on:
  workflow_dispatch:
  push:
    branches:
      - agent/staging-integration
    paths:
      - "scripts/validate_remote_staging_operational_journey.mjs"
      - "app/api/jobs/**"
      - "app/api/customer/bids/**"
      - "app/api/driver/mobile/**"
      - "app/api/admin/jobs/**"
      - "app/api/driver/finance/**"
      - ".github/workflows/validate-remote-staging-operational-journey.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: validate-remote-staging-operational-journey
  cancel-in-progress: false

jobs:
  operational-journey:
    name: Customer post to carrier invoice with persistent POD
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_STAGING_PROJECT_REF: svfjlhljuizckzabtewx
      STAGING_APP_ORIGIN: http://127.0.0.1:3000

    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Guard disposable staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/staging-integration"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_STAGING_PROJECT_REF"
          echo "Operational journey validation is restricted to disposable staging."

      - name: Resolve disposable project API keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --output /tmp/supabase-api-keys.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          keys = json.loads(Path('/tmp/supabase-api-keys.json').read_text(encoding='utf-8'))

          def find_key(*, names=(), types=()):
              for item in keys:
                  if item.get('name') in names and item.get('api_key'):
                      return item['api_key']
              for item in keys:
                  if item.get('type') in types and item.get('api_key'):
                      return item['api_key']
              return None

          public_key = find_key(names=('anon',), types=('publishable',))
          secret_key = find_key(names=('service_role',), types=('secret',))
          if not public_key or not secret_key:
              raise SystemExit('Required disposable staging API keys were unavailable.')

          print(f'::add-mask::{public_key}')
          print(f'::add-mask::{secret_key}')
          url = f'https://{os.environ["SUPABASE_PROJECT_REF"]}.supabase.co'
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'STAGING_SUPABASE_URL={url}\n')
              handle.write(f'STAGING_SUPABASE_PUBLIC_KEY={public_key}\n')
              handle.write(f'STAGING_SUPABASE_SECRET_KEY={secret_key}\n')
              handle.write(f'NEXT_PUBLIC_SUPABASE_URL={url}\n')
              handle.write(f'EXPECTED_NEXT_PUBLIC_SUPABASE_URL={url}\n')
              handle.write(f'NEXT_PUBLIC_SUPABASE_ANON_KEY={public_key}\n')
              handle.write(f'SUPABASE_SERVICE_ROLE_KEY={secret_key}\n')
          PY

          rm -f /tmp/supabase-api-keys.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate operational script syntax
        run: node --check scripts/validate_remote_staging_operational_journey.mjs

      - name: Wait for current P0 schema evidence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            status=$(curl --silent --show-error \
              --output /tmp/p0-evidence.json \
              --write-out '%{http_code}' \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/agent/staging-integration/staging-validation/p0-latest.json" || true)
            if [ "$status" = "200" ]; then
              count=$(python -c "import json; print(json.load(open('/tmp/p0-evidence.json')).get('verified_migration_count', 0))")
              result=$(python -c "import json; print(json.load(open('/tmp/p0-evidence.json')).get('result', ''))")
              project=$(python -c "import json; print(json.load(open('/tmp/p0-evidence.json')).get('project_ref', ''))")
              if [ "$result" = "success" ] && [ "$project" = "$EXPECTED_STAGING_PROJECT_REF" ] && [ "$count" -ge 190 ]; then
                echo "Current P0 schema evidence accepted: ${count} migrations."
                exit 0
              fi
            fi
            if [ "$attempt" -eq 100 ]; then
              echo "Current P0 schema evidence did not reach 190 successful migrations."
              cat /tmp/p0-evidence.json || true
              exit 1
            fi
            sleep 2
          done

      - name: Build application against disposable staging
        env:
          SUPABASE_ENV_STRICT: "true"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          XDRIVE_FORCE_CANONICAL_HOST: "false"
        run: npm run build

      - name: Start staging-bound application
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          XDRIVE_FORCE_CANONICAL_HOST: "false"
        run: |
          set -euo pipefail
          npm run start > /tmp/staging-operational-app.log 2>&1 &
          echo $! > /tmp/staging-operational-app.pid

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then
              echo "Staging-bound application is ready."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/staging-operational-app.log
          exit 1

      - name: Run authenticated operational journey
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_remote_staging_operational_journey.mjs \
            2>&1 | tee /tmp/staging-operational-journey.log

      - name: Record machine-readable operational result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<PY
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              'result': '${JOB_STATUS}',
              'source_sha': '${GITHUB_SHA}',
              'run_id': '${GITHUB_RUN_ID}',
              'run_url': '${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}',
              'branch': '${GITHUB_REF_NAME}',
              'project_ref': '${SUPABASE_PROJECT_REF}',
              'journey': 'customer post -> carrier quote -> customer API award -> driver lifecycle -> POD -> completion -> invoice',
              'production_targeted': False,
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('/tmp/operational-result.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

          encoded=$(base64 -w 0 /tmp/operational-result.json)
          endpoint="repos/${GITHUB_REPOSITORY}/contents/staging-validation/operational-journey-latest.json"
          existing_sha=$(gh api "$endpoint?ref=agent/staging-integration" --jq .sha 2>/dev/null || true)
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "$endpoint" \
              -f message="ci(staging): record operational journey ${JOB_STATUS}" \
              -f content="$encoded" \
              -f sha="$existing_sha" \
              -f branch="agent/staging-integration"
          else
            gh api --method PUT "$endpoint" \
              -f message="ci(staging): record operational journey ${JOB_STATUS}" \
              -f content="$encoded" \
              -f branch="agent/staging-integration"
          fi

      - name: Publish operational journey success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -f body="<!-- remote-staging-operational-journey-success -->
          ### Authenticated job-to-POD-to-invoice journey passed

          Commit: \`${GITHUB_SHA}\`
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Verified on disposable staging: authorised and idempotent customer job posting; authenticated carrier quote; duplicate quote prevention; customer award through the real API; immutable commercial agreement; approved Owner Driver allocation; canonical pickup/delivery transitions; POD-required delivery guard; persistent signature, recipient and photos; operator completion; and idempotent marketplace invoice generation. Production was not targeted."

      - name: Publish concise operational journey failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '<!-- remote-staging-operational-journey-failure -->'
            echo '### Authenticated operational journey failed'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            if [ -f /tmp/staging-operational-journey.log ]; then
              grep -E 'STAGING_OPERATIONAL_JOURNEY_FAILED|returned [0-9]+|Failed to|did not|incorrect|not |Expected' \
                /tmp/staging-operational-journey.log | tail -n 55 \
                || tail -n 70 /tmp/staging-operational-journey.log
            elif [ -f /tmp/staging-operational-app.log ]; then
              tail -n 70 /tmp/staging-operational-app.log
            elif [ -f /tmp/p0-evidence.json ]; then
              cat /tmp/p0-evidence.json
            else
              echo 'The workflow failed before an operational journey log was created.'
            fi
            echo '```'
          } > /tmp/operational-diagnostic.md

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -F body=@/tmp/operational-diagnostic.md

      - name: Upload non-secret operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-staging-operational-journey
          path: |
            /tmp/staging-operational-app.log
            /tmp/staging-operational-journey.log
            /tmp/p0-evidence.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop staging-bound application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/staging-operational-app.pid ]; then
            kill "$(cat /tmp/staging-operational-app.pid)" || true
          fi
