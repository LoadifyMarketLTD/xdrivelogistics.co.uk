name: Patch Account Reconciliation Bootstrap

on:
  push:
    branches:
      - fix/supabase-clean-bootstrap-remove-onboarding-bom
    paths:
      - ".github/workflows/patch-account-reconciliation-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supabase-clean-bootstrap-remove-onboarding-bom
          fetch-depth: 0

      - name: Make production account reconciliation clean-bootstrap safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260721221000_reconcile_confirmed_current_accounts.sql')
          text = path.read_text(encoding='utf-8')
          old = """  IF EXISTS (
            SELECT 1
            FROM confirmed_account_plan plan
            LEFT JOIN auth.users u ON lower(u.email) = plan.email
            WHERE u.id IS NULL
          ) THEN
            RAISE EXCEPTION 'A confirmed account identity is missing from auth.users.';
          END IF;

          """
          replacement = """  -- Clean/disposable databases do not contain production identities. The
          -- reconciliation is intentionally scoped to matching auth.users rows and must
          -- therefore skip absent accounts rather than blocking schema bootstrap.

          """
          if old not in text:
              raise SystemExit('Expected missing-identity guard not found')
          path.write_text(text.replace(old, replacement), encoding='utf-8', newline='\n')
          PY

      - name: Commit focused reconciliation repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xdrive-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260721221000_reconcile_confirmed_current_accounts.sql
          git commit -m "fix(migrations): skip absent production identities on clean bootstrap"
          git push origin HEAD:fix/supabase-clean-bootstrap-remove-onboarding-bom
