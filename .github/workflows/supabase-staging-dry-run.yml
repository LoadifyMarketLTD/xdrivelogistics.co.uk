name: Supabase Staging Migration Dry Run

on:
  push:
    branches:
      - agent/staging-integration
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-staging-dry-run.yml"

permissions:
  contents: read

concurrency:
  group: supabase-staging-dry-run
  cancel-in-progress: false

jobs:
  migration-dry-run:
    name: Validate migrations against staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout staging integration branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "SUPABASE_PROJECT_REF has an unexpected format"; exit 1; }
          echo "Staging configuration is present. Secret values are not printed."

      - name: Initialize temporary Supabase CLI configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Link disposable staging project
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration history comparison
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Dry-run all pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --linked \
            --dry-run \
            --include-all \
            --password "$SUPABASE_DB_PASSWORD"
