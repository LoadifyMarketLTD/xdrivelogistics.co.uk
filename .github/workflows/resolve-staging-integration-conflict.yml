name: Inspect staging integration conflicts

on:
  push:
    branches:
      - agent/staging-integration
    paths:
      - .github/staging-merge-main.trigger

permissions:
  contents: write

concurrency:
  group: inspect-staging-integration-conflicts
  cancel-in-progress: true

jobs:
  inspect-conflicts:
    name: Record exact main merge conflicts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/staging-integration
          fetch-depth: 0

      - name: Inspect merge without committing it
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = 'LoadifyMarketLTD/xdrivelogistics.co.uk'
          test "${GITHUB_REF_NAME}" = 'agent/staging-integration'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main

          base_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)

          {
            printf 'merge_status=%s\n' "${merge_status}"
            printf 'base_branch=agent/staging-integration\n'
            printf 'base_sha=%s\n' "${base_sha}"
            printf 'main_sha=%s\n' "${main_sha}"
            printf 'conflict_count=%s\n' "${#conflicts[@]}"
            printf '%s\n' 'conflicts:'
            if (( ${#conflicts[@]} == 0 )); then
              printf '%s\n' '  (none)'
            else
              printf '  %s\n' "${conflicts[@]}"
            fi
          } > /tmp/main-merge-conflicts-latest.txt

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          else
            git reset --hard HEAD
          fi

          mkdir -p staging-validation
          cp /tmp/main-merge-conflicts-latest.txt staging-validation/main-merge-conflicts-latest.txt
          git add staging-validation/main-merge-conflicts-latest.txt

          if git diff --cached --quiet; then
            echo 'Conflict report is unchanged.'
            exit 0
          fi

          git commit -m 'ci(staging): record current main merge conflicts'
          git push origin HEAD:agent/staging-integration
