<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDrive Driver - Support</title><link rel="stylesheet" href="styles.css"></head><body class="live-hydrate">
<main class="app-shell"><section class="phone"><header class="topbar"><a class="back" href="more.html">&#8592;</a><div class="top-title">Help &amp; Support</div><div></div></header>
<section class="screen detail-screen"><div class="panel"><div class="panel-title">Create support ticket</div><label class="field-label">Subject</label><input id="supportSubject" class="form-input" maxlength="200" placeholder="Brief summary"><label class="field-label">Category</label><select id="supportCategory" class="form-input"><option value="technical">Technical</option><option value="operations">Operations</option><option value="billing">Billing</option><option value="compliance">Compliance</option><option value="general">General</option></select><label class="field-label">Priority</label><select id="supportPriority" class="form-input"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select><label class="field-label">Description</label><textarea id="supportDescription" class="form-input" maxlength="5000" placeholder="Describe what happened, what you expected and what you see now."></textarea><label class="post-check"><input id="supportDiagnostics" type="checkbox" checked> Include safe app/device diagnostics</label><button id="supportSend" class="primary" type="button">Submit Ticket</button><div id="supportMsg" class="save-note"></div></div>
<div class="panel"><div class="panel-title">Technical diagnostics</div><div id="supportDiagView" class="details">Loading diagnostics...</div><div class="details">Diagnostics never include your password, access token, refresh token or private document contents.</div></div></section>
