name: Apply role workspace rebuild

on:
  push:
    branches:
      - feature/role-workspaces-rebuild-2026-07-20
    paths:
      - '.workspace-rebuild/**'
      - '.github/workflows/apply-role-workspace-rebuild.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/role-workspaces-rebuild-2026-07-20
          fetch-depth: 0

      - name: Restore reviewed workspace files
        shell: bash
        run: |
          set -euo pipefail
          cat .workspace-rebuild/part* | base64 --decode > /tmp/role-workspace-rebuild.tar.xz
          tar -xJf /tmp/role-workspace-rebuild.tar.xz -C .
          rm -rf .workspace-rebuild
          rm -f .github/workflows/apply-role-workspace-rebuild.yml

      - name: Commit reconstructed workspace implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild role-specific workspaces and dashboards"
          git push origin HEAD:feature/role-workspaces-rebuild-2026-07-20
