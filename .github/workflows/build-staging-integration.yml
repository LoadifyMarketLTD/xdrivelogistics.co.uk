name: Build staging integration branch

on:
  push:
    branches:
      - agent/staging-integration

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[integration-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-integration
          fetch-depth: 0

      - name: Merge validated remediation branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xdrive-staging-integration'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin agent/operations-lifecycle-hardening agent/dashboard-consistency-overhaul
          git merge --no-ff --no-edit origin/agent/operations-lifecycle-hardening
          git merge --no-ff --no-edit origin/agent/dashboard-consistency-overhaul
          rm .github/workflows/build-staging-integration.yml
          git add -A
          git commit -m 'Build combined staging integration [integration-ready]'
          git push origin HEAD:agent/staging-integration
