name: Validate Clean Staging Bootstrap

on:
  push:
    branches:
      - agent/staging-integration
    paths:
      - "supabase/migrations/**"
      - "scripts/prepare_staging_bootstrap.py"
      - ".github/workflows/validate-clean-staging-bootstrap.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: validate-clean-staging-bootstrap
  cancel-in-progress: false

jobs:
  local-bootstrap:
    name: Apply normalized migrations to disposable local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout staging integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report UTF-8 BOM in source migrations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bad = [
              str(path)
              for path in sorted(Path('supabase/migrations').glob('*.sql'))
              if path.read_bytes().startswith(b'\xef\xbb\xbf')
          ]

          if bad:
              print('UTF-8 BOM found; temporary bootstrap copies will be normalized:')
              print('\n'.join(bad))
          else:
              print('No UTF-8 BOM found in source migrations.')
          PY

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize isolated Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging-bootstrap
          mkdir -p .staging-bootstrap
          cd .staging-bootstrap
          supabase init

      - name: Prepare normalized migration set
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_staging_bootstrap.py \
            --source supabase/migrations \
            --destination .staging-bootstrap/supabase/migrations \
            --manifest .staging-bootstrap/bootstrap-manifest.json

      - name: Validate prepared migration manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          manifest_path = pathlib.Path('.staging-bootstrap/bootstrap-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          migrations = manifest['migrations']
          versions = [item['staged_version'] for item in migrations]

          assert migrations, 'No migrations were prepared'
          assert len(versions) == len(set(versions)), 'Prepared migration versions are not unique'
          assert manifest['excluded_count'] == 1, 'Unexpected number of excluded migrations'
          assert manifest['excluded'][0]['source'] == '068_targeted_data_repair_current_accounts.sql'
          assert all(
              not pathlib.Path('.staging-bootstrap/supabase/migrations', item['staged'])
              .read_bytes()
              .startswith(b'\xef\xbb\xbf')
              for item in migrations
          ), 'Prepared migration still contains UTF-8 BOM'
          assert migrations[-5]['source'] == '20260720231500_onboarding_approval_driver_access_guard.sql'
          assert migrations[-4]['source'] == '20260720234500_canonical_driver_job_lifecycle.sql'
          assert migrations[-3]['source'] == '20260720235500_invoice_delivery_tracking.sql'
          assert migrations[-2]['source'] == '20260721000500_job_creation_idempotency.sql'
          assert migrations[-1]['source'] == '20260721001500_scrub_notification_secrets.sql'

          print(
              f"Manifest validated: {len(migrations)} included, "
              f"{manifest['excluded_count']} excluded, "
              f"{manifest.get('bom_normalized_count', 0)} BOM-normalized"
          )
          PY

      - name: Start disposable local Supabase and apply migrations
        id: start_supabase
        working-directory: .staging-bootstrap
        shell: bash
        run: |
          set -euo pipefail
          supabase start 2>&1 | tee bootstrap-start.log

      - name: Rebuild disposable database from migration zero
        id: reset_database
        working-directory: .staging-bootstrap
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local 2>&1 | tee bootstrap-reset.log

      - name: Confirm every prepared migration was recorded
        id: confirm_migrations
        working-directory: .staging-bootstrap
        shell: bash
        run: |
          set -euo pipefail
          expected=$(python -c "import json; print(json.load(open('bootstrap-manifest.json'))['included_count'])")
          actual=$(supabase migration list --local | tee bootstrap-migration-list.log | awk '/^[[:space:]]*[0-9]{14}[[:space:]]*\|/ {count++} END {print count+0}')
          echo "Expected migration count: $expected" | tee bootstrap-count.log
          echo "Recorded migration count: $actual" | tee -a bootstrap-count.log
          test "$actual" -eq "$expected"

      - name: Publish failure diagnostics to PR 248
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '<!-- clean-staging-bootstrap-diagnostic -->'
            echo '### Clean staging bootstrap failure'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            found=0
            for file in \
              .staging-bootstrap/bootstrap-start.log \
              .staging-bootstrap/bootstrap-reset.log \
              .staging-bootstrap/bootstrap-migration-list.log \
              .staging-bootstrap/bootstrap-count.log; do
              if [ -f "$file" ]; then
                found=1
                echo "===== $file ====="
                tail -n 180 "$file"
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo 'The workflow failed before a Supabase diagnostic log was created.'
            fi
            echo '```'
          } > /tmp/bootstrap-diagnostic.md
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -F body=@/tmp/bootstrap-diagnostic.md

      - name: Upload bootstrap manifest
        if: ${{ always() && hashFiles('.staging-bootstrap/bootstrap-manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: clean-staging-bootstrap-manifest
          path: .staging-bootstrap/bootstrap-manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop disposable local Supabase
        if: always()
        shell: bash
        run: |
          if [ -d ".staging-bootstrap" ]; then
            cd .staging-bootstrap
            supabase stop --no-backup || true
          else
            echo "Skipping stop: .staging-bootstrap was not created."
          fi
