name: Resolve staging integration conflict

on:
  push:
    branches:
      - agent/staging-integration
    paths:
      - .github/staging-merge-main.trigger

permissions:
  contents: write

concurrency:
  group: resolve-staging-integration-conflict
  cancel-in-progress: false

jobs:
  merge-main:
    name: Merge main with guarded resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/staging-integration
          fetch-depth: 0

      - name: Merge current main and resolve only onboarding init
        shell: bash
        run: |
          set -euo pipefail

          expected_repo='LoadifyMarketLTD/xdrivelogistics.co.uk'
          expected_branch='agent/staging-integration'
          expected_conflict='app/api/onboarding/init/route.ts'

          test "${GITHUB_REPOSITORY}" = "${expected_repo}"
          test "${GITHUB_REF_NAME}" = "${expected_branch}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'The integration branch already contains current main.'
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          mapfile -t unresolved < <(git diff --name-only --diff-filter=U)

          if (( ${#unresolved[@]} > 0 )); then
            if (( ${#unresolved[@]} != 1 )) || [[ "${unresolved[0]}" != "${expected_conflict}" ]]; then
              echo 'Unexpected conflicts detected:' >&2
              printf ' - %s\n' "${unresolved[@]}" >&2
              git merge --abort
              exit 1
            fi

            # The branch version is the reviewed combined implementation: it
            # includes main's strict identity checks plus cooldown, resend and
            # revoke controls. Keep it as the explicit resolution.
            git checkout --ours -- "${expected_conflict}"
            git add "${expected_conflict}"
          elif (( merge_status != 0 )); then
            echo 'Merge failed without a resolvable conflict.' >&2
            git merge --abort
            exit 1
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain.' >&2
            git merge --abort
            exit 1
          fi

          git commit -m 'Merge main into staging integration and resolve onboarding init'
          git push origin HEAD:agent/staging-integration
