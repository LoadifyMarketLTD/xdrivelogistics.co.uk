name: Fix middleware auth resolution

on:
  push:
    branches:
      - agent/platform-p0-stabilization

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[middleware-auth-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform-p0-stabilization
      - name: Apply exact middleware corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('middleware.ts')
          text = path.read_text()

          def replace_once(pattern: str, replacement: str, value: str) -> str:
              updated, count = re.subn(pattern, replacement, value, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'Expected one middleware match for: {pattern}; found {count}')
              return updated

          text = replace_once(
              r"\.select\('role, status, is_driver'\)",
              ".select('role, status, is_driver, company_id')",
              text,
          )
          text = replace_once(
              r"\.select\('role_in_company'\)\s*\.eq\('user_id', authData\.user\.id\)\s*\.eq\('status', 'active'\)\s*\.limit\(1\)\s*\.maybeSingle\(\),",
              ".select('company_id, role_in_company')\n      .eq('user_id', authData.user.id)\n      .eq('status', 'active')\n      .order('company_id', { ascending: true }),",
              text,
          )
          text = replace_once(
              r"const profile = profileRes\.error\s*\? null\s*:\s*\(profileRes\.data as \{ role\?: string \| null; status\?: string \| null; is_driver\?: boolean \| null \} \| null\);\s*const membership = membershipRes\.error\s*\? null\s*:\s*\(membershipRes\.data as \{ role_in_company\?: string \| null \} \| null\);",
              "const profile = profileRes.error\n    ? null\n    : (profileRes.data as { role?: string | null; status?: string | null; is_driver?: boolean | null; company_id?: string | null } | null);\n  const memberships = membershipRes.error\n    ? []\n    : (membershipRes.data as Array<{ company_id?: string | null; role_in_company?: string | null }> | null) ?? [];\n  const membership = memberships.find((item) => Boolean(profile?.company_id) && item.company_id === profile?.company_id)\n    ?? memberships[0]\n    ?? null;",
              text,
          )
          text = replace_once(
              r"if \(profileStatus === 'pending' \|\| profileStatus === 'blocked' \|\| profileStatus === 'suspended' \|\| profileStatus === 'inactive'\) \{\s*return \{ kind: 'forbidden' \};\s*\}",
              "if (profileStatus === 'blocked') {\n    return { kind: 'forbidden' };\n  }",
              text,
          )
          text = replace_once(
              r"if \(auth\.appAccess === false\) \{",
              "if (auth.appAccess !== true) {",
              text,
          )
          path.write_text(text)
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'xdrive-ci-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add middleware.ts
          git commit -m 'Align middleware auth and company resolution [middleware-auth-fixed]'
          git push origin HEAD:agent/platform-p0-stabilization
