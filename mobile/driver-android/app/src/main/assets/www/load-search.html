<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDrive Driver - Search Loads</title><link rel="stylesheet" href="styles.css"></head>
<body class="live-hydrate"><main class="app-shell"><section class="phone">
<header class="topbar"><a class="back" href="index.html">&#8592;</a><div class="top-title">Search Loads</div><button id="lsReset" class="icon-btn" type="button" aria-label="Reset filters">&#8634;</button></header>
<section class="screen detail-screen">
<div class="panel"><div class="panel-title">Marketplace filters</div>
<label class="field-label">Collection area / postcode</label><input id="lsFrom" class="form-input" placeholder="e.g. BB1 or Blackburn">
<label class="field-label">Collection radius</label><select id="lsFromRadius" class="form-input"><option>10</option><option>20</option><option selected>30</option><option>50</option><option>100</option><option>200</option><option>300</option></select>
<label class="field-label">Delivery area / postcode</label><input id="lsTo" class="form-input" placeholder="e.g. LS10 or Leeds">
<label class="field-label">Delivery radius</label><select id="lsToRadius" class="form-input"><option>10</option><option>20</option><option>30</option><option>50</option><option selected>100</option><option>200</option><option>300</option></select>
<div class="form-grid-2"><div><label class="field-label">Pickup from</label><input id="lsDateFrom" type="date" class="form-input"></div><div><label class="field-label">Pickup to</label><input id="lsDateTo" type="date" class="form-input"></div></div>
<label class="field-label">Vehicle</label><input id="lsVehicle" class="form-input" placeholder="e.g. LWB, Luton, Small Van">
<div class="form-grid-2"><div><label class="field-label">Min vehicle</label><input id="lsMinVehicle" class="form-input" placeholder="Small Van"></div><div><label class="field-label">Max vehicle</label><input id="lsMaxVehicle" class="form-input" placeholder="Luton"></div></div>
<label class="field-label">Body / equipment requirement</label><input id="lsBody" class="form-input" placeholder="e.g. Curtain Side, Box, Tail Lift">
<label class="field-label">Freight</label><input id="lsFreight" class="form-input" placeholder="Pallets, boxes, machinery">
<label class="field-label">Member</label><input id="lsMember" class="form-input" placeholder="Company / member code">
<label class="field-label">Job description</label><select id="lsDescription" class="form-input"><option value="">Any</option><option value="deliver_direct">Deliver direct</option><option value="same_day_timed">Same day timed</option><option value="same_day_non_timed">Same day non-timed</option><option value="next_day_timed">Next day timed</option><option value="next_day_non_timed">Next day non-timed</option><option value="3_5_days">3–5 days</option><option value="multi_drop">Multi-drop</option></select>
<label class="field-label">Load type</label><select id="lsLoadType" class="form-input"><option value="all">All</option><option value="on_demand">On demand</option><option value="daily_hire">Daily hire</option><option value="regular_load">Regular load</option></select>
<div class="form-grid-2"><div><label class="field-label">Min budget £</label><input id="lsMinBudget" type="number" inputmode="decimal" class="form-input"></div><div><label class="field-label">Max budget £</label><input id="lsMaxBudget" type="number" inputmode="decimal" class="form-input"></div></div>
<label class="field-label">Posted within</label><select id="lsPosted" class="form-input"><option value="">Any time</option><option value="1">1 hour</option><option value="3">3 hours</option><option value="6">6 hours</option><option value="12">12 hours</option><option value="24">24 hours</option></select>
<label class="post-check"><input id="lsSaveDefault" type="checkbox"> Save these filters as my default search</label>
<button id="lsSearch" class="primary" type="button">Search Marketplace</button><div id="lsMsg" class="save-note"></div>
</div>
<div class="panel"><div class="info-row"><span><strong>Results</strong><br><small id="lsSummary">Use filters above to search.</small></span><span class="badge" id="lsCount">0</span></div><div class="tabs two-tabs search-view-tabs"><button id="lsListTab" class="tab active" type="button">List</button><button id="lsMapTab" class="tab" type="button">Map</button></div><div id="lsResults" class="details"></div><div id="lsMapPanel" style="display:none"><div style="position:relative;height:390px;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#EAF2FF"><iframe id="lsMapFrame" title="Load search map" style="position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none"></iframe><div id="lsMapMarkers" style="position:absolute;inset:0;pointer-events:none"></div></div><div id="lsMapLegend" class="details" style="margin-top:8px">Search to show public-area load markers.</div><a id="lsMapExternal" class="secondary" href="#" target="_blank" rel="noopener" style="display:none;place-items:center;text-decoration:none">Open Interactive Map</a></div><div id="lsPager" class="quote-actions"></div></div>
</section>
<nav class="bottom-nav"><a class="nav-item active" href="index.html"><span>&#8962;</span><small>Loads</small></a><a class="nav-item" href="alerts.html"><span>&#9671;</span><small>Alerts</small></a><a class="nav-item" href="quote.html"><span>&#9670;</span><small>My Quotes</small></a><a class="nav-item" href="bookings.html"><span>&#9635;</span><small>Bookings</small></a><a class="nav-item" href="more.html"><span>&#8226;&#8226;&#8226;</span><small>More</small></a></nav>
</section></main><script src="real-data.js"></script><script src="load-search.js"></script><script src="theme.js"></script></body></html>
