name: Patch Company Registration Variable Conflict

on:
  push:
    branches:
      - fix/atomic-company-registration-only
    paths:
      - ".github/workflows/patch-company-registration-variable-conflict.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-company-registration-only
          fetch-depth: 0

      - name: Prefer SQL columns in registration RPC conflict targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260723205000_atomic_authenticated_company_registration.sql')
          text = path.read_text(encoding='utf-8')
          old = """AS $$
          DECLARE
            v_company_number text := regexp_replace(upper(trim(coalesce(p_company_number, ''))), '[^A-Z0-9]', '', 'g');"""
          new = """AS $$
          #variable_conflict use_column
          DECLARE
            v_company_number text := regexp_replace(upper(trim(coalesce(p_company_number, ''))), '[^A-Z0-9]', '', 'g');"""
          if old not in text:
              raise SystemExit('Expected registration RPC declaration not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Commit focused SQL repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xdrive-company-registration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260723205000_atomic_authenticated_company_registration.sql
          git commit -m "fix(company-registration): disambiguate conflict target columns"
          git push origin HEAD:fix/atomic-company-registration-only
