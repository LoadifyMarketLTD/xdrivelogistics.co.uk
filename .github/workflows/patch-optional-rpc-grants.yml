name: Patch Optional RPC Grants

on:
  push:
    branches:
      - fix/supabase-clean-bootstrap-remove-onboarding-bom
    paths:
      - ".github/workflows/patch-optional-rpc-grants.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supabase-clean-bootstrap-remove-onboarding-bom
          fetch-depth: 0

      - name: Guard production-only RPC privilege changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260720121500_p0_database_security_and_schema_consistency.sql')
          text = path.read_text(encoding='utf-8')

          signatures = [
              'cancel_unassigned_exchange_job_atomic(uuid, uuid, text)',
              'delete_unbid_exchange_job_atomic(uuid, uuid)',
              'request_awarded_job_cancellation_atomic(uuid, uuid, text)',
              'decide_awarded_job_cancellation_atomic(uuid, uuid, text, text)',
              'safe_dedup_drivers(uuid)',
          ]

          for signature in signatures:
              old = f"REVOKE ALL ON FUNCTION public.{signature}\n  FROM PUBLIC, anon, authenticated;\nGRANT EXECUTE ON FUNCTION public.{signature}\n  TO service_role;"
              replacement = f"""DO $$
          BEGIN
            IF to_regprocedure('public.{signature}') IS NOT NULL THEN
              EXECUTE 'REVOKE ALL ON FUNCTION public.{signature} FROM PUBLIC, anon, authenticated';
              EXECUTE 'GRANT EXECUTE ON FUNCTION public.{signature} TO service_role';
            END IF;
          END;
          $$;"""
              if old not in text:
                  raise SystemExit(f'Expected privilege block not found: {signature}')
              text = text.replace(old, replacement)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit focused optional-RPC repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xdrive-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260720121500_p0_database_security_and_schema_consistency.sql
          git commit -m "fix(migrations): guard production-only RPC grants"
          git push origin HEAD:fix/supabase-clean-bootstrap-remove-onboarding-bom
