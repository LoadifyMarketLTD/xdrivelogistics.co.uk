name: Patch P0 optional RPC grants

on:
  push:
    branches:
      - agent/staging-integration
    paths:
      - ".github/workflows/patch-p0-optional-rpc-grants.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-integration
          fetch-depth: 0

      - name: Guard optional RPC grants and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260720121500_p0_database_security_and_schema_consistency.sql')
          text = path.read_text(encoding='utf-8')

          old = """REVOKE ALL ON FUNCTION public.cancel_unassigned_exchange_job_atomic(uuid, uuid, text)
  FROM PUBLIC, anon, authenticated;
GRANT EXECUTE ON FUNCTION public.cancel_unassigned_exchange_job_atomic(uuid, uuid, text)
  TO service_role;

REVOKE ALL ON FUNCTION public.delete_unbid_exchange_job_atomic(uuid, uuid)
  FROM PUBLIC, anon, authenticated;
GRANT EXECUTE ON FUNCTION public.delete_unbid_exchange_job_atomic(uuid, uuid)
  TO service_role;

REVOKE ALL ON FUNCTION public.request_awarded_job_cancellation_atomic(uuid, uuid, text)
  FROM PUBLIC, anon, authenticated;
GRANT EXECUTE ON FUNCTION public.request_awarded_job_cancellation_atomic(uuid, uuid, text)
  TO service_role;

REVOKE ALL ON FUNCTION public.decide_awarded_job_cancellation_atomic(uuid, uuid, text, text)
  FROM PUBLIC, anon, authenticated;
GRANT EXECUTE ON FUNCTION public.decide_awarded_job_cancellation_atomic(uuid, uuid, text, text)
  TO service_role;
"""

          new = """-- Cancellation RPCs may be absent on a clean schema and are restored by later
-- lifecycle migrations. Harden only the signatures that already exist here.
DO $$
DECLARE
  v_signature text;
BEGIN
  FOREACH v_signature IN ARRAY ARRAY[
    'public.cancel_unassigned_exchange_job_atomic(uuid,uuid,text)',
    'public.delete_unbid_exchange_job_atomic(uuid,uuid)',
    'public.request_awarded_job_cancellation_atomic(uuid,uuid,text)',
    'public.decide_awarded_job_cancellation_atomic(uuid,uuid,text,text)'
  ] LOOP
    IF to_regprocedure(v_signature) IS NOT NULL THEN
      EXECUTE format(
        'REVOKE ALL ON FUNCTION %s FROM PUBLIC, anon, authenticated',
        v_signature
      );
      EXECUTE format(
        'GRANT EXECUTE ON FUNCTION %s TO service_role',
        v_signature
      );
    END IF;
  END LOOP;
END
$$;
"""

          if old not in text:
              raise SystemExit('Expected optional RPC grant block was not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/patch-p0-optional-rpc-grants.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260720121500_p0_database_security_and_schema_consistency.sql
          git add -u .github/workflows/patch-p0-optional-rpc-grants.yml
          git commit -m "fix(db): guard optional cancellation RPC grants"
          git push origin HEAD:agent/staging-integration
