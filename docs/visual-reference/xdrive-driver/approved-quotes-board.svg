  <text x="40" y="762" font-family="Arial" font-size="13" fill="#555664">Also mandatory: Submit Quote form with GBP / £0.00 / Additional extras / Total / Will collect within / Vehicle / Notes; completed Bookings list with View POD; swipe-left delete state with red delete action.</text>
  <text x="40" y="784" font-family="Arial" font-size="13" fill="#555664">Canonical colours: navy #292837, yellow #FFE66A, blue #5199D6, green #4CAD3F/#65C653, page #F2F3F7. Bottom navigation remains Home / Alerts / Quotes / Bookings / More.</text>
