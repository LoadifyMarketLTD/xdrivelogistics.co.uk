(function(){'use strict';const q=new URLSearchParams(location.search),src=q.get('src')||'',ret=q.get('return')||'bookings.html',title=q.get('title')||'Delivery Evidence';document.querySelector('.top-title').textContent=title;const back=document.getElementById('evidenceBack'),cta=document.getElementById('backToBooking');back.href=ret;cta.href=ret;const img=document.getElementById('evidenceImage'),err=document.getElementById('evidenceError');if(!src){img.style.display='none';err.style.display='block';return}img.onload=()=>{err.style.display='none'};img.onerror=()=>{img.style.display='none';err.style.display='block'};img.src=src;})();
