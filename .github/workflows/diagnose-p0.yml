name: Diagnose P0 Build

on:
  push:
    branches:
      - agent/platform-p0-stabilization

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic-output]') }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform-p0-stabilization

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture checks
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          {
            echo '=== LINT ==='
            npm run lint
            echo "LINT_EXIT=$?"
            echo '=== TYPECHECK ==='
            npm run typecheck
            echo "TYPECHECK_EXIT=$?"
            echo '=== BUILD ==='
            npm run build
            echo "BUILD_EXIT=$?"
          } > diagnostics/p0-build.log 2>&1
          tail -n 300 diagnostics/p0-build.log > diagnostics/p0-build.tail

      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name 'xdrive-ci-diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/p0-build.tail
          git commit -m 'Capture P0 diagnostic output [diagnostic-output]' || exit 0
          git push origin HEAD:agent/platform-p0-stabilization
