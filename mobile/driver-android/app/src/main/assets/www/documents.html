<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDrive Driver - Documents</title><link rel="stylesheet" href="styles.css"></head><body class="live-hydrate">
<main class="app-shell"><section class="phone"><header class="topbar"><a class="back" href="more.html">&#8592;</a><div class="top-title">Documents</div><div></div></header>
<section class="screen detail-screen"><div class="panel"><div class="panel-title">Add document</div>
<label class="field-label">Document type</label><select id="docType" class="form-input"><optgroup label="Driver"><option value="driver|Driving Licence">Driving Licence</option><option value="driver|Insurance">Insurance</option><option value="driver|DBS Certificate">DBS Certificate</option><option value="driver|CPC Card">CPC Card</option><option value="driver|Tacho Card">Tacho Card</option><option value="driver|Medical Certificate">Medical Certificate</option><option value="driver|Other">Other driver document</option></optgroup><optgroup label="Vehicle"><option value="vehicle|MOT">MOT</option><option value="vehicle|V5C">V5C</option><option value="vehicle|Vehicle Insurance">Vehicle Insurance</option><option value="vehicle|Goods in Transit">Goods in Transit</option><option value="vehicle|Other">Other vehicle document</option></optgroup></select>
<label class="field-label">Issue date</label><input id="docIssued" class="form-input" type="date"><label class="field-label">Expiry date</label><input id="docExpiry" class="form-input" type="date"><label class="field-label">File</label><input id="docFile" class="form-input" type="file" accept="image/jpeg,image/png,image/webp,.pdf"><input id="docCamera" type="file" accept="image/*" capture="environment" hidden><button id="docCapture" class="secondary" type="button">Capture Document Photo</button><div id="docSelected" class="details">No file selected.</div><button id="docAdd" class="primary">Add Document</button><div id="docMessage" class="save-note"></div></div>
<div class="panel"><div class="panel-title">Your documents</div><div id="documentList"><div class="details">Loading documents...</div></div></div></section>

<script src="real-data.js"></script><script src="documents-real.js"></script><script src="theme.js"></script></body></html>
