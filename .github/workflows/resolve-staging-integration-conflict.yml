name: Inspect staging integration conflicts

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - agent/staging-integration

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: inspect-staging-integration-conflicts
  cancel-in-progress: true

jobs:
  inspect-conflicts:
    name: Record exact main merge conflicts
    if: >-
      github.event.pull_request.number == 271 &&
      github.event.pull_request.head.ref == 'main' &&
      github.event.pull_request.base.ref == 'agent/staging-integration' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout trusted integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/staging-integration
          fetch-depth: 0

      - name: Inspect merge without committing it
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY}" = 'LoadifyMarketLTD/xdrivelogistics.co.uk'
          test "${{ github.event.pull_request.head.ref }}" = 'main'
          test "${{ github.event.pull_request.base.ref }}" = 'agent/staging-integration'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)

          mkdir -p staging-validation
          {
            printf 'merge_status=%s\n' "${merge_status}"
            printf 'base_branch=agent/staging-integration\n'
            printf 'base_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'main_sha=%s\n' "$(git rev-parse origin/main)"
            printf 'conflict_count=%s\n' "${#conflicts[@]}"
            printf '%s\n' 'conflicts:'
            if (( ${#conflicts[@]} == 0 )); then
              printf '%s\n' '  (none)'
            else
              printf '  %s\n' "${conflicts[@]}"
            fi
          } > staging-validation/main-merge-conflicts-latest.txt

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          else
            git reset --hard HEAD
          fi

          git add staging-validation/main-merge-conflicts-latest.txt
          if git diff --cached --quiet; then
            echo 'Conflict report is unchanged.'
            exit 0
          fi

          git commit -m 'ci(staging): record current main merge conflicts'
          git push origin HEAD:agent/staging-integration
