name: Native Android Reproducible Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/staging-integration
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-reproducible-build.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: native-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-android:
    name: Build native Android APKs from exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_VERSION: "8.7"
      GRADLE_BIN_SHA256: "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d"
      CI_XDRIVE_BASE_URL: "https://www.xdrivelogistics.co.uk"
      CI_SUPABASE_URL: "https://ci-build.invalid"
      CI_SUPABASE_ANON_KEY: "ci-build-placeholder-not-for-runtime"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install checksum-pinned Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          distribution="gradle-${GRADLE_VERSION}-bin.zip"
          curl --fail --location --silent --show-error \
            "https://services.gradle.org/distributions/${distribution}" \
            --output "/tmp/${distribution}"
          echo "${GRADLE_BIN_SHA256}  /tmp/${distribution}" | sha256sum --check --strict
          unzip -q "/tmp/${distribution}" -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify pinned toolchain and project identity
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test "$(gradle --version | awk '/Gradle / {print $2; exit}')" = "$GRADLE_VERSION"
          grep -F 'id("com.android.application") version "8.5.2"' build.gradle.kts
          grep -F 'id("org.jetbrains.kotlin.android") version "1.9.24"' build.gradle.kts
          grep -F 'applicationId = "co.uk.xdrivelogistics.driver"' app/build.gradle.kts
          grep -F 'compileSdk = 35' app/build.gradle.kts
          grep -F 'targetSdk = 35' app/build.gradle.kts

      - name: Clean and build debug plus unsigned release APK
        working-directory: android-native
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
        run: |
          set -euo pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PXDRIVE_BASE_URL="$CI_XDRIVE_BASE_URL" \
            -PXDRIVE_SUPABASE_URL="$CI_SUPABASE_URL" \
            -PXDRIVE_SUPABASE_ANON_KEY="$CI_SUPABASE_ANON_KEY" \
            clean :app:assembleDebug :app:assembleRelease

      - name: Verify APK outputs
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$debug_apk"
          test -s "$release_apk"
          unzip -tq "$debug_apk"
          unzip -tq "$release_apk"
          echo "Artifacts are CI validation-only and must not be published or installed as production releases."

      - name: Create SHA-bound provenance manifest
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/provenance
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          debug_sha=$(sha256sum "$debug_apk" | awk '{print $1}')
          release_sha=$(sha256sum "$release_apk" | awk '{print $1}')
          debug_size=$(stat -c '%s' "$debug_apk")
          release_size=$(stat -c '%s' "$release_apk")

          cat > build/provenance/android-build.json <<JSON
          {
            "schema": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "commit_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "gradle_version": "${GRADLE_VERSION}",
            "gradle_distribution_sha256": "${GRADLE_BIN_SHA256}",
            "android_gradle_plugin": "8.5.2",
            "kotlin_android_plugin": "1.9.24",
            "java_version": "17",
            "application_id": "co.uk.xdrivelogistics.driver",
            "configuration": "CI validation only; unsigned release; non-production Supabase endpoint",
            "artifacts": [
              {
                "path": "${debug_apk}",
                "sha256": "${debug_sha}",
                "size_bytes": ${debug_size},
                "signed": false,
                "variant": "debug"
              },
              {
                "path": "${release_apk}",
                "sha256": "${release_sha}",
                "size_bytes": ${release_size},
                "signed": false,
                "variant": "release"
              }
            ]
          }
          JSON

          cat build/provenance/android-build.json

      - name: Upload exact-SHA APKs and provenance
        uses: actions/upload-artifact@v4
        with:
          name: xdrive-native-android-${{ github.sha }}
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/release/app-release-unsigned.apk
            android-native/build/provenance/android-build.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android build success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          debug_sha=$(sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
          release_sha=$(sha256sum android-native/app/build/outputs/apk/release/app-release-unsigned.apk | awk '{print $1}')
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -f body="<!-- native-android-reproducible-build-success -->
          ### Native Android exact-SHA build passed

          Commit: \`${GITHUB_SHA}\`
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Gradle: \`${GRADLE_VERSION}\` (distribution checksum verified)
          Debug APK SHA-256: \`${debug_sha}\`
          Unsigned release APK SHA-256: \`${release_sha}\`

          Both APKs were compiled from the exact branch SHA with Java 17, AGP 8.5.2 and Kotlin 1.9.24. They use a non-production CI configuration and are validation artifacts, not deployable signed releases."

      - name: Publish Android build failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -f body="<!-- native-android-reproducible-build-failure -->
          ### Native Android exact-SHA build failed

          Commit: \`${GITHUB_SHA}\`
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The APK has not been declared reproducible. Inspect the failed Gradle step before any Android release decision."
