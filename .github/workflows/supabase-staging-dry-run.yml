name: Supabase Staging Migration Dry Run

on:
  push:
    branches:
      - agent/staging-integration
    paths:
      - "supabase/migrations/**"
      - "scripts/prepare_staging_bootstrap.py"
      - ".github/workflows/supabase-staging-dry-run.yml"

permissions:
  contents: read

concurrency:
  group: supabase-staging-dry-run
  cancel-in-progress: false

env:
  EXPECTED_STAGING_PROJECT_REF: svfjlhljuizckzabtewx

jobs:
  migration-dry-run:
    name: Validate normalized migrations against staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout staging integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/staging-integration
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

          if [ "$SUPABASE_PROJECT_REF" != "$EXPECTED_STAGING_PROJECT_REF" ]; then
            echo "Refusing dry-run: configured project is not the approved disposable staging project."
            exit 1
          fi

          echo "Staging-only project guard passed."

      - name: Prepare normalized migration set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging-dry-run
          mkdir -p .staging-dry-run
          cd .staging-dry-run
          supabase init
          cd ..

          python scripts/prepare_staging_bootstrap.py \
            --source supabase/migrations \
            --destination .staging-dry-run/supabase/migrations \
            --manifest .staging-dry-run/dry-run-manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('.staging-dry-run/dry-run-manifest.json').read_text(encoding='utf-8')
          )
          assert manifest['included_count'] > 0, 'No migrations were prepared'
          assert manifest['excluded_count'] == 1, manifest['excluded_count']
          assert manifest['excluded'][0]['source'] == '068_targeted_data_repair_current_accounts.sql'
          print(
              f"Prepared normalized dry-run manifest: {manifest['included_count']} included, "
              "1 production-data repair excluded."
          )
          PY

      - name: Link disposable staging project
        working-directory: .staging-dry-run
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect normalized and remote migration history
        working-directory: .staging-dry-run
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            2>&1 | tee staging-history.log

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path('dry-run-manifest.json').read_text(encoding='utf-8'))
          expected = [item['staged_version'] for item in manifest['migrations']]
          text = Path('staging-history.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text).replace('`', '')

          local = []
          remote = []
          for line in text.splitlines():
              parts = [part.strip() for part in re.split(r'[|│]', line)]
              if len(parts) < 2:
                  continue
              if re.fullmatch(r'\d{14}', parts[0]):
                  local.append(parts[0])
              if re.fullmatch(r'\d{14}', parts[1]):
                  remote.append(parts[1])

          if local != expected:
              raise SystemExit(
                  f'Normalized local history does not match the generated manifest: '
                  f'{len(local)} local versus {len(expected)} expected.'
              )

          expected_set = set(expected)
          remote_only = [version for version in remote if version not in expected_set]
          shared_remote = [version for version in remote if version in expected_set]

          if shared_remote != expected[:len(shared_remote)]:
              raise SystemExit(
                  'Remote normalized migrations are not an exact prefix of the generated manifest.'
              )

          Path('remote-only-versions.txt').write_text(
              ''.join(f'{version}\n' for version in remote_only),
              encoding='utf-8',
          )

          if remote_only:
              print('Remote-only migration history detected:')
              print('\n'.join(remote_only))
              print(
                  'The non-mutating dry-run is deferred. The guarded staging deploy workflow '
                  'will mark only these obsolete history entries as reverted before running its own dry-run.'
              )
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                  handle.write('SKIP_NORMALIZED_PUSH=true\n')
          else:
              print(
                  f'Normalized migration parity passed: {len(remote)} remote of '
                  f'{len(expected)} prepared.'
              )
          PY

      - name: Dry-run normalized pending migrations
        if: env.SKIP_NORMALIZED_PUSH != 'true'
        working-directory: .staging-dry-run
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --linked \
            --dry-run \
            --include-all \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Report deferred dry-run
        if: env.SKIP_NORMALIZED_PUSH == 'true'
        run: echo "Dry-run deferred until guarded staging history repair completes."
