name: Driver Mobile Recovery Validation

on:
  pull_request:
    branches:
      - fix/android-agp-86-build-20260827
    paths:
      - "apps/driver-mobile/**"
      - ".github/workflows/driver-mobile-recovery-ci.yml"

permissions:
  contents: write

jobs:
  expo-driver-recovery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconcile Expo dependency lock
        working-directory: apps/driver-mobile
        run: npm install --package-lock-only --ignore-scripts

      - name: Persist reconciled lock on validation branch
        shell: bash
        run: |
          if git diff --quiet -- apps/driver-mobile/package-lock.json; then
            echo "package-lock.json already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/driver-mobile/package-lock.json
            git commit -m "fix(driver-mobile): sync Expo dependency lock [skip netlify]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Clean install from reconciled lock
        working-directory: apps/driver-mobile
        run: npm ci

      - name: Expo Driver typecheck
        working-directory: apps/driver-mobile
        run: npm run typecheck

      - name: Expo Driver tests
        working-directory: apps/driver-mobile
        run: npm test
