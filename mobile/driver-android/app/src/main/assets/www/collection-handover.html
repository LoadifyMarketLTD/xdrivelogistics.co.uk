<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDrive Driver - Collection</title><link rel="stylesheet" href="styles.css"></head><body class="live-hydrate">
<main class="app-shell"><section class="phone"><header class="topbar"><a class="back" href="javascript:history.back()">&#10005;</a><div id="handoverTitle" class="top-title">On Site (Pickup)</div><div></div></header>
<section class="screen detail-screen handover-cx-screen">
<div class="handover-route-block"><div id="handoverContext" class="handover-context">Loading job...</div><div id="handoverRoute" class="handover-route">Loading route...</div></div>
<div class="handover-section"><div class="handover-section-title">Job Details</div><div class="handover-simple-row"><span>Vehicle</span><strong id="handoverVehicle">Loading</strong></div><div class="handover-simple-row"><span>Equipment</span><strong id="handoverEquipment">Loading</strong></div></div>
<div class="handover-section"><div class="handover-section-title">Load Confirmation</div>
<label class="field-label">Number Of Items</label><input id="handoverItems" class="form-input" type="number" min="0" inputmode="numeric" placeholder="Number of items">
<label class="field-label">Packaging</label><input id="handoverPackaging" class="form-input" placeholder="Pallets, boxes, loose items...">
<label class="field-label">Weight (kg)</label><input id="handoverWeight" class="form-input" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Weight (kg)">
<label class="field-label">ETA to next stop / delivery</label><input id="handoverEta" class="form-input" type="number" min="0" max="1440" inputmode="numeric" placeholder="Minutes">
<label class="field-label">Driver's Notes</label><textarea id="handoverNotes" class="form-input handover-notes" rows="5" placeholder="Please add any notes regarding collection, loading, delays or instructions"></textarea></div>
<div class="handover-section handover-evidence-section"><div class="handover-section-title">Evidence</div><label class="field-label">Collection photos <span class="required-mark">Required</span></label><div class="pod-upload"><label class="pod-upload-btn" for="handoverPhotos">Add photos</label><span id="handoverPhotoInfo">At least one photo is required.</span><input id="handoverPhotos" class="pod-file-input" type="file" accept="image/jpeg,image/png" capture="environment" multiple></div>
<label class="field-label">Documents <span class="optional-mark">Optional</span></label><div class="pod-upload"><label class="pod-upload-btn" for="handoverDocuments">Add documents</label><span id="handoverDocumentInfo">PDF, JPEG or PNG.</span><input id="handoverDocuments" class="pod-file-input" type="file" accept="application/pdf,image/jpeg,image/png" multiple></div><a id="handoverDocumentBuilder" class="secondary document-builder-link" href="#">Build multi-page document</a><div id="handoverBuiltDocuments" class="details"></div></div>
<button id="handoverSave" class="primary handover-save">Save</button><div id="handoverMessage" class="save-note"></div></section>
<nav class="bottom-nav"><a class="nav-item" href="index.html"><span>&#8962;</span><small>Loads</small></a><a class="nav-item" href="alerts.html"><span>&#9671;</span><small>Alerts</small></a><a class="nav-item" href="quote.html"><span>&#9670;</span><small>My Quotes</small></a><a class="nav-item active" href="bookings.html"><span>&#9635;</span><small>Bookings</small></a><a class="nav-item" href="more.html"><span>&#8226;&#8226;&#8226;</span><small>More</small></a></nav></section></main>
<script src="real-data.js"></script><script src="collection-handover.js"></script><script src="theme.js"></script></body></html>
