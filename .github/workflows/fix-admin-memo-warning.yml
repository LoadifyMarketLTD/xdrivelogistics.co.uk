name: Fix admin memo dependency

on:
  push:
    branches:
      - agent/dashboard-consistency-overhaul

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[admin-memo-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dashboard-consistency-overhaul
      - name: Apply exact source correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/admin/AdminWorkspaceModules.tsx')
          text = path.read_text()
          replacements = [
              (
                  "  const data = useCompanyWorkspaceData();\n  const [selectedDriverId, setSelectedDriverId] = useState<string | null>(null);",
                  "  const data = useCompanyWorkspaceData();\n  const locations = data.locations;\n  const [selectedDriverId, setSelectedDriverId] = useState<string | null>(null);",
              ),
              ("new Map<string, (typeof data.locations)[number]>()", "new Map<string, (typeof locations)[number]>()"),
              ("for (const location of data.locations)", "for (const location of locations)"),
              ("}, [data.locations]);", "}, [locations]);"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'xdrive-ci-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add app/admin/AdminWorkspaceModules.tsx
          git commit -m 'Stabilize fleet position memo dependencies [admin-memo-fixed]'
          git push origin HEAD:agent/dashboard-consistency-overhaul
