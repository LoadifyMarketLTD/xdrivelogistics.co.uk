name: Apply Android Driver Remediation

on:
  push:
    branches:
      - fix/android-driver-tracking-only
    paths:
      - .github/workflows/apply-android-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-driver-tracking-only
          fetch-depth: 0

      - name: Apply verified Android changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "android-native/app/src/main/AndroidManifest.xml",
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n',
              '',
          )

          replace_once(
              "android-native/app/src/main/java/co/uk/xdrivelogistics/driver/data/Models.kt",
              '''data class DriverJob(
              val id: String,
              val status: String,
              val currentStatus: String,
              val pickupLocation: String,
              val deliveryLocation: String,
              val pickupDatetime: String?,
              val deliveryDatetime: String?,
              val clientName: String,
              val clientPhone: String,
              val vehicleType: String,
              val cargoType: String,
              val budgetAmount: Double?,
              val loadDetails: String,
              val pickupPostcode: String = "",
              val deliveryPostcode: String = "",
              val distanceMiles: Double? = null,
              val pickupDistanceFromActiveDeliveryMiles: Double? = null,
              val deliveryPhotos: List<String> = emptyList(),
              val podPhotos: List<String> = emptyList(),
          )''',
              '''data class DriverJob(
              val id: String,
              val status: String,
              val currentStatus: String,
              val pickupLocation: String,
              val deliveryLocation: String,
              val pickupDatetime: String?,
              val deliveryDatetime: String?,
              val clientName: String,
              val clientPhone: String,
              val vehicleType: String,
              val cargoType: String,
              val budgetAmount: Double?,
              val loadDetails: String,
              val pickupPostcode: String = "",
              val deliveryPostcode: String = "",
              val distanceMiles: Double? = null,
              val pickupDistanceFromActiveDeliveryMiles: Double? = null,
              val deliveryPhotos: List<String> = emptyList(),
              val podPhotos: List<String> = emptyList(),
              val collectionPhotoUrl: String? = null,
              val deliverySignatureData: String? = null,
              val clientSignatureName: String = "",
              val podRequired: Boolean = true,
          ) {
              fun statusKey(): String = currentStatus.ifBlank { status }.lowercase()

              fun driverStatusKey(): String = when (statusKey()) {
                  "assigned", "accepted" -> "allocated"
                  "arrived_pickup" -> "on_site_pickup"
                  "collected" -> "loaded"
                  "on_route_delivery", "on_my_way_to_delivery" -> "in_transit"
                  "arrived_delivery" -> "on_site_delivery"
                  else -> statusKey()
              }

              fun isInProgress(): Boolean = driverStatusKey() in listOf(
                  "on_my_way",
                  "on_site_pickup",
                  "loaded",
                  "in_transit",
                  "on_site_delivery",
                  "in_progress",
              )

              fun isActive(): Boolean = driverStatusKey() !in listOf(
                  "delivered",
                  "completed",
                  "cancelled",
                  "canceled",
                  "invoiced",
                  "paid",
              )

              fun hasPod(): Boolean = deliveryPhotos.isNotEmpty() || podPhotos.isNotEmpty()

              fun hasCollectionProof(): Boolean = !collectionPhotoUrl.isNullOrBlank()

              fun hasDeliveryConfirmation(): Boolean = !podRequired || (
                  hasPod() &&
                      !deliverySignatureData.isNullOrBlank() &&
                      clientSignatureName.isNotBlank()
                  )

              fun isPosted(): Boolean = driverStatusKey() == "posted"

              fun routeLabel(): String = "${pickupLocation.ifBlank { "Pickup" }} -> ${deliveryLocation.ifBlank { "Delivery" }}"

              fun statusLabel(): String = when (driverStatusKey()) {
                  "allocated" -> "Allocated"
                  "awarded" -> "Awarded"
                  "on_my_way" -> "On My Way to Collection"
                  "on_site_pickup" -> "Arrived at Collection"
                  "loaded" -> "Loaded"
                  "in_transit" -> "On My Way to Delivery"
                  "on_site_delivery" -> "Arrived at Delivery"
                  "delivered" -> "Delivered (POD)"
                  "completed" -> "Completed"
                  else -> driverStatusKey().split('_').joinToString(" ") { part ->
                      part.replaceFirstChar { it.uppercase() }
                  }
              }

              fun nextStatus(): String = when (driverStatusKey()) {
                  "allocated", "awarded" -> "on_my_way"
                  "on_my_way" -> "on_site_pickup"
                  "on_site_pickup" -> "loaded"
                  "loaded" -> "in_transit"
                  "in_transit" -> "on_site_delivery"
                  "on_site_delivery" -> "delivered"
                  "delivered" -> "completed"
                  else -> ""
              }

              fun nextActionLabel(): String = when (nextStatus()) {
                  "on_my_way" -> "On My Way to Collection"
                  "on_site_pickup" -> "Arrived at Collection"
                  "loaded" -> "Loaded / Collected"
                  "in_transit" -> "On My Way to Delivery"
                  "on_site_delivery" -> "Arrived at Delivery"
                  "delivered" -> "Mark as Delivered"
                  "completed" -> "Complete Job"
                  else -> "No further action"
              }

              fun needsCollectionProof(): Boolean = nextStatus() == "loaded"

              fun blockingRequirementFor(next: String = nextStatus()): String? = when (next) {
                  "loaded" -> if (hasCollectionProof()) null else "Take or upload a collection photo before marking the job Loaded."
                  "delivered" -> when {
                      !podRequired -> null
                      !hasPod() -> "Upload a signed POD or delivery photo before marking the job Delivered."
                      clientSignatureName.isBlank() -> "Enter and save the recipient name before marking the job Delivered."
                      deliverySignatureData.isNullOrBlank() -> "Confirm the signed POD evidence before marking the job Delivered."
                      else -> null
                  }
                  else -> null
              }

              fun canMoveNext(): Boolean = nextStatus().isNotBlank() && blockingRequirementFor() == null
          }''',
          )

          vm = "android-native/app/src/main/java/co/uk/xdrivelogistics/driver/DriverViewModel.kt"
          replace_once(
              vm,
              '''            if (selectedJob == null) {
                          _uiState.value = _uiState.value.copy(error = "Selected job was not found.")
                          return@launch
                      }

                      if (nextStatus == "delivered" && selectedJob.podPhotos.isEmpty() && selectedJob.deliveryPhotos.isEmpty()) {
                          _uiState.value = _uiState.value.copy(error = "Upload POD before marking delivery complete.")
                          return@launch
                      }
          ''',
              '''            if (selectedJob == null) {
                          _uiState.value = _uiState.value.copy(error = "Selected job was not found.")
                          return@launch
                      }

                      if (selectedJob.isPosted()) {
                          _uiState.value = _uiState.value.copy(
                              error = "Submit a quote and wait for the customer to award the job before starting work.",
                          )
                          return@launch
                      }

                      selectedJob.blockingRequirementFor(nextStatus)?.let { requirement ->
                          _uiState.value = _uiState.value.copy(error = requirement)
                          return@launch
                      }
          ''',
          )
          replace_once(
              vm,
              '''            val result = if (nextStatus == "allocated" && selectedJob.status.lowercase() == "posted") {
                          api.acceptPostedJob(session, profile, jobId)
                      } else {
                          api.updateJobStatus(session, profile.driverId, jobId, nextStatus)
                      }

                      result
          ''',
              '''            api.updateJobStatus(session, profile.driverId, jobId, nextStatus)
          ''',
          )
          replace_once(
              vm,
              '''                        message = "POD uploaded.",
          ''',
              '''                        message = if (selectedJob.needsCollectionProof()) {
                              "Collection proof uploaded."
                          } else {
                              "Delivery proof uploaded."
                          },
          ''',
          )
          replace_once(
              vm,
              '''    fun uploadComplianceDocument(docType: String, isVehicleDocument: Boolean, fileName: String, mimeType: String, bytes: ByteArray) {
          ''',
              '''    fun confirmDeliveryRecipientForSelectedJob(recipientName: String) {
                  viewModelScope.launch {
                      val session = _uiState.value.session ?: return@launch
                      val profile = _uiState.value.profile ?: return@launch
                      val selectedJob = _uiState.value.jobs.firstOrNull { it.id == _uiState.value.selectedJobId }
                      if (selectedJob == null) {
                          _uiState.value = _uiState.value.copy(error = "Select a job first.")
                          return@launch
                      }
                      if (!selectedJob.hasPod()) {
                          _uiState.value = _uiState.value.copy(error = "Upload the signed POD evidence before confirming the recipient.")
                          return@launch
                      }
                      val cleanName = recipientName.trim()
                      if (cleanName.isBlank()) {
                          _uiState.value = _uiState.value.copy(error = "Enter the recipient name.")
                          return@launch
                      }

                      _uiState.value = _uiState.value.copy(isLoading = true, error = "", message = "")
                      api.confirmDeliveryRecipient(session, profile.driverId, selectedJob, cleanName)
                          .onSuccess {
                              _uiState.value = _uiState.value.copy(
                                  isLoading = false,
                                  message = "Recipient and signed POD evidence confirmed.",
                              )
                              refreshDriverData()
                          }
                          .onFailure { error ->
                              _uiState.value = _uiState.value.copy(
                                  isLoading = false,
                                  error = error.friendlyDriverMessage("Failed to confirm delivery evidence."),
                              )
                          }
                  }
              }

              fun uploadComplianceDocument(docType: String, isVehicleDocument: Boolean, fileName: String, mimeType: String, bytes: ByteArray) {
          ''',
          )
          replace_once(
              vm,
              '''private fun isValidTransition(currentRaw: String, next: String): Boolean {
              val current = normalizeDriverStatus(currentRaw)
              return when (next) {
                  "allocated" -> current == "posted"
                  "on_my_way" -> current == "allocated"
                  "on_site_pickup" -> current == "on_my_way"
                  "loaded" -> current == "on_site_pickup"
                  "on_site_delivery" -> current == "loaded"
                  "delivered" -> current == "on_site_delivery"
                  "completed" -> current == "delivered"
                  else -> false
              }
          }

          private fun normalizeDriverStatus(raw: String): String =
              when (raw.lowercase().ifBlank { "assigned" }) {
                  "assigned" -> "allocated"
                  "accepted" -> "allocated"
                  "arrived_pickup" -> "on_site_pickup"
                  "collected" -> "loaded"
                  "in_transit", "on_route_delivery", "arrived_delivery" -> "on_site_delivery"
                  else -> raw.lowercase().ifBlank { "assigned" }
              }
          ''',
              '''private fun isValidTransition(currentRaw: String, next: String): Boolean {
              val current = normalizeDriverStatus(currentRaw)
              return when (next) {
                  "on_my_way" -> current in listOf("allocated", "awarded")
                  "on_site_pickup" -> current == "on_my_way"
                  "loaded" -> current == "on_site_pickup"
                  "in_transit" -> current == "loaded"
                  "on_site_delivery" -> current == "in_transit"
                  "delivered" -> current == "on_site_delivery"
                  "completed" -> current == "delivered"
                  else -> false
              }
          }

          private fun normalizeDriverStatus(raw: String): String =
              when (raw.lowercase().ifBlank { "assigned" }) {
                  "assigned", "accepted" -> "allocated"
                  "arrived_pickup" -> "on_site_pickup"
                  "collected" -> "loaded"
                  "on_route_delivery", "on_my_way_to_delivery" -> "in_transit"
                  "arrived_delivery" -> "on_site_delivery"
                  else -> raw.lowercase().ifBlank { "assigned" }
              }
          ''',
          )

          api = "android-native/app/src/main/java/co/uk/xdrivelogistics/driver/data/ApiClient.kt"
          replace_once(
              api,
              'val select = "id,status,current_status,pickup_location,delivery_location,pickup_datetime,delivery_datetime,client_name,client_phone,collection_contact_phone,delivery_contact_phone,vehicle_type,cargo_type,budget_amount,load_details,delivery_photos,pod_photos,distance_miles,job_distance_miles,pickup_postcode,delivery_postcode"',
              'val select = "id,status,current_status,pickup_location,delivery_location,pickup_datetime,delivery_datetime,client_name,client_phone,collection_contact_phone,delivery_contact_phone,vehicle_type,cargo_type,budget_amount,load_details,delivery_photos,pod_photos,collection_photo_url,delivery_signature_data,client_signature_name,pod_required,distance_miles,job_distance_miles,pickup_postcode,delivery_postcode"',
          )
          replace_once(
              api,
              '''                            deliveryPhotos = parseStringArray(row.get("delivery_photos") as? JsonArray),
                                      podPhotos = parseStringArray(row.get("pod_photos") as? JsonArray),
          ''',
              '''                            deliveryPhotos = parseStringArray(row.get("delivery_photos") as? JsonArray),
                                      podPhotos = parseStringArray(row.get("pod_photos") as? JsonArray),
                                      collectionPhotoUrl = row.nullableString("collection_photo_url"),
                                      deliverySignatureData = row.get("delivery_signature_data")
                                          ?.takeUnless { it.isJsonNull }
                                          ?.let { gson.toJson(it) },
                                      clientSignatureName = row.string("client_signature_name"),
                                      podRequired = row.get("pod_required")
                                          ?.takeUnless { it.isJsonNull }
                                          ?.asBoolean
                                          ?: true,
          ''',
          )
          start = '''    suspend fun acceptPostedJob(
                  session: DriverSession,
                  profile: DriverProfile,
                  jobId: String,
              ): Result<Unit> = networkResult {
                  val payload = JsonObject().apply {
                      addProperty("status", "allocated")
                      addProperty("current_status", "allocated")
                      addProperty("assigned_driver_id", profile.driverId)
                      addProperty("assigned_company_id", profile.companyId)
                      addProperty("updated_at", java.time.Instant.now().toString())
                  }

                  val encodedJobId = URLEncoder.encode(jobId, StandardCharsets.UTF_8.toString())
                  val request = Request.Builder()
                      .url("${supabaseUrl.trimEnd('/')}/rest/v1/jobs?id=eq.$encodedJobId&status=eq.posted")
                      .addHeader("apikey", supabaseAnonKey)
                      .addHeader("Authorization", "Bearer ${session.accessToken}")
                      .addHeader("Content-Type", "application/json")
                      .addHeader("Prefer", "return=representation")
                      .patch(gson.toJson(payload).toRequestBody(jsonMediaType))
                      .build()

                  http.newCall(request).execute().use { response ->
                      val raw = response.body?.string().orEmpty()
                      if (!response.isSuccessful) {
                          throw IllegalStateException(extractError(raw, "Failed to accept job."))
                      }

                      val rows = runCatching { gson.fromJson(raw, JsonArray::class.java) }.getOrNull()
                      if (rows == null || rows.size() == 0) {
                          throw IllegalStateException("This job is no longer available.")
                      }
                  }
              }

          '''
          replace_once(api, start, '')
          replace_once(
              api,
              '''        val nextDeliveryPhotos = (job.deliveryPhotos + storagePath).distinct()
                  val nextPodPhotos = (job.podPhotos + storagePath).distinct()

                  val patchBody = JsonObject().apply {
                      add("delivery_photos", gson.toJsonTree(nextDeliveryPhotos))
                      add("pod_photos", gson.toJsonTree(nextPodPhotos))
                      addProperty("updated_at", java.time.Instant.now().toString())
                  }
          ''',
              '''        val patchBody = JsonObject().apply {
                      if (job.needsCollectionProof()) {
                          addProperty("collection_photo_url", storagePath)
                      } else {
                          val nextDeliveryPhotos = (job.deliveryPhotos + storagePath).distinct()
                          val nextPodPhotos = (job.podPhotos + storagePath).distinct()
                          add("delivery_photos", gson.toJsonTree(nextDeliveryPhotos))
                          add("pod_photos", gson.toJsonTree(nextPodPhotos))
                      }
                      addProperty("updated_at", java.time.Instant.now().toString())
                  }
          ''',
          )
          replace_once(
              api,
              '''    private fun supabaseRequest(pathAndQuery: String, accessToken: String): Request {
          ''',
              '''    suspend fun confirmDeliveryRecipient(
                  session: DriverSession,
                  driverId: String,
                  job: DriverJob,
                  recipientName: String,
              ): Result<Unit> = networkResult {
                  val evidencePath = (job.podPhotos + job.deliveryPhotos).lastOrNull()
                      ?: throw IllegalStateException("Upload the signed POD evidence first.")
                  val confirmation = JsonObject().apply {
                      addProperty("type", "signed_pod_evidence")
                      addProperty("evidence_path", evidencePath)
                      addProperty("recipient_name", recipientName)
                      addProperty("confirmed_at", java.time.Instant.now().toString())
                      addProperty("source", "xdrive_driver_android")
                  }
                  val patchBody = JsonObject().apply {
                      addProperty("client_signature_name", recipientName)
                      add("delivery_signature_data", confirmation)
                      addProperty("updated_at", java.time.Instant.now().toString())
                  }
                  val encodedJobId = URLEncoder.encode(job.id, StandardCharsets.UTF_8.toString())
                  val encodedDriverId = URLEncoder.encode(driverId, StandardCharsets.UTF_8.toString())
                  val request = Request.Builder()
                      .url("${supabaseUrl.trimEnd('/')}/rest/v1/jobs?id=eq.$encodedJobId&assigned_driver_id=eq.$encodedDriverId")
                      .addHeader("apikey", supabaseAnonKey)
                      .addHeader("Authorization", "Bearer ${session.accessToken}")
                      .addHeader("Content-Type", "application/json")
                      .addHeader("Prefer", "return=representation")
                      .patch(gson.toJson(patchBody).toRequestBody(jsonMediaType))
                      .build()

                  http.newCall(request).execute().use { response ->
                      val raw = response.body?.string().orEmpty()
                      if (!response.isSuccessful) {
                          throw IllegalStateException(extractError(raw, "Failed to confirm delivery evidence."))
                      }
                      val rows = runCatching { gson.fromJson(raw, JsonArray::class.java) }.getOrNull()
                      if (rows == null || rows.size() == 0) {
                          throw IllegalStateException("Delivery evidence could not be linked to this assignment.")
                      }
                  }
              }

              private fun supabaseRequest(pathAndQuery: String, accessToken: String): Request {
          ''',
          )
          replace_once(
              api,
              '''            "arrived_pickup" -> "on_site_pickup"
                          "loaded" -> "loaded"
                          "on_route_delivery", "arrived_delivery" -> "on_site_delivery"
                          "delivered" -> "delivered"
          ''',
              '''            "arrived_pickup", "on_my_way_to_pickup" -> "on_site_pickup"
                          "loaded" -> "loaded"
                          "on_route_delivery", "on_my_way_to_delivery" -> "in_transit"
                          "arrived_delivery" -> "on_site_delivery"
                          "delivered" -> "delivered"
          ''',
          )

          activity = "android-native/app/src/main/java/co/uk/xdrivelogistics/driver/MainActivity.kt"
          replace_once(activity, 'import android.content.Intent\n', 'import android.content.Intent\nimport android.content.pm.PackageManager\n')
          replace_once(activity, 'import android.os.Bundle\n', 'import android.os.Build\nimport android.os.Bundle\n')
          replace_once(activity, 'import androidx.core.content.FileProvider\n', 'import androidx.core.content.ContextCompat\nimport androidx.core.content.FileProvider\n')
          replace_once(
              activity,
              '''                var pendingComplianceDoc by remember { mutableStateOf<ComplianceDocOption?>(null) }
          ''',
              '''                var pendingComplianceDoc by remember { mutableStateOf<ComplianceDocOption?>(null) }
                          var startTrackingAfterPermission by remember { mutableStateOf(false) }
          ''',
          )
          replace_once(
              activity,
              '''                val locationPermissionLauncher = rememberLauncherForActivityResult(
                          contract = ActivityResultContracts.RequestMultiplePermissions()
                      ) { granted ->
                          val hasLocation = granted[Manifest.permission.ACCESS_FINE_LOCATION] == true ||
                              granted[Manifest.permission.ACCESS_COARSE_LOCATION] == true

                          if (hasLocation) {
                              fusedClient.lastLocation.addOnSuccessListener { location ->
                                  if (location != null) viewModel.sendLocation(location.latitude, location.longitude)
                              }
                          }
                      }
          ''',
              '''                val locationPermissionLauncher = rememberLauncherForActivityResult(
                          contract = ActivityResultContracts.RequestMultiplePermissions()
                      ) { granted ->
                          val hasLocation = granted[Manifest.permission.ACCESS_FINE_LOCATION] == true ||
                              granted[Manifest.permission.ACCESS_COARSE_LOCATION] == true ||
                              hasForegroundLocationPermission()

                          if (hasLocation && startTrackingAfterPermission) {
                              ContextCompat.startForegroundService(
                                  this,
                                  Intent(this, TrackingService::class.java),
                              )
                          } else if (hasLocation) {
                              fusedClient.lastLocation.addOnSuccessListener { location ->
                                  if (location != null) viewModel.sendLocation(location.latitude, location.longitude)
                              }
                          }
                          startTrackingAfterPermission = false
                      }
          ''',
          )
          replace_once(
              activity,
              '''                            onSaveReturnJourney = viewModel::saveReturnJourney,
          ''',
              '''                            onSaveReturnJourney = viewModel::saveReturnJourney,
                                      onConfirmDeliveryRecipient = viewModel::confirmDeliveryRecipientForSelectedJob,
          ''',
          )
          replace_once(
              activity,
              '''                            onStartTracking = {
                                      locationPermissionLauncher.launch(
                                          arrayOf(
                                              Manifest.permission.ACCESS_FINE_LOCATION,
                                              Manifest.permission.ACCESS_COARSE_LOCATION,
                                          )
                                      )
                                      startForegroundService(Intent(this, TrackingService::class.java))
                                  },
          ''',
              '''                            onStartTracking = {
                                      if (hasForegroundLocationPermission()) {
                                          ContextCompat.startForegroundService(
                                              this,
                                              Intent(this, TrackingService::class.java),
                                          )
                                      } else {
                                          startTrackingAfterPermission = true
                                          locationPermissionLauncher.launch(trackingRuntimePermissions())
                                      }
                                  },
          ''',
          )
          replace_once(
              activity,
              '''                            onPublishLocation = {
                                      locationPermissionLauncher.launch(
                                          arrayOf(
                                              Manifest.permission.ACCESS_FINE_LOCATION,
                                              Manifest.permission.ACCESS_COARSE_LOCATION,
                                          )
                                      )
                                  },
          ''',
              '''                            onPublishLocation = {
                                      startTrackingAfterPermission = false
                                      if (hasForegroundLocationPermission()) {
                                          fusedClient.lastLocation.addOnSuccessListener { location ->
                                              if (location != null) viewModel.sendLocation(location.latitude, location.longitude)
                                          }
                                      } else {
                                          locationPermissionLauncher.launch(trackingRuntimePermissions(includeNotifications = false))
                                      }
                                  },
          ''',
          )
          replace_once(
              activity,
              '''    onSaveReturnJourney: (String, String, String) -> Unit,
              onStartTracking: () -> Unit,
          ''',
              '''    onSaveReturnJourney: (String, String, String) -> Unit,
              onConfirmDeliveryRecipient: (String) -> Unit,
              onStartTracking: () -> Unit,
          ''',
          )
          replace_once(
              activity,
              '''                DriverTab.ACTION -> ActionScreen(state, onSendNote, onSubmitQuote, onPickPodFile, onCapturePodPhoto, onMoveStatus, onNavigateTo)
          ''',
              '''                DriverTab.ACTION -> ActionScreen(
                      state,
                      onSendNote,
                      onSubmitQuote,
                      onPickPodFile,
                      onCapturePodPhoto,
                      onConfirmDeliveryRecipient,
                      onMoveStatus,
                      onNavigateTo,
                  )
          ''',
          )
          replace_once(
              activity,
              '''    onCapturePodPhoto: () -> Unit,
              onMoveStatus: (String) -> Unit,
          ''',
              '''    onCapturePodPhoto: () -> Unit,
              onConfirmDeliveryRecipient: (String) -> Unit,
              onMoveStatus: (String) -> Unit,
          ''',
          )
          replace_once(
              activity,
              '''                "POD" -> item { PodPanel(selected, onCapturePodPhoto, onPickPodFile) }
          ''',
              '''                "POD" -> item {
                      PodPanel(
                          selected,
                          onCapturePodPhoto,
                          onPickPodFile,
                          onConfirmDeliveryRecipient,
                      )
                  }
          ''',
          )
          replace_once(
              activity,
              '''            if (job.nextStatus() == "delivered" && !job.hasPod()) {
                          Text("POD required before Delivered.", color = Yellow, fontSize = 13.sp, modifier = Modifier.padding(top = 8.dp))
                      }
          ''',
              '''            job.blockingRequirementFor()?.let { requirement ->
                          Text(requirement, color = Yellow, fontSize = 13.sp, modifier = Modifier.padding(top = 8.dp))
                      }
          ''',
          )
          old_pod = '''@Composable
          private fun PodPanel(job: DriverJob, onCapturePodPhoto: () -> Unit, onPickPodFile: () -> Unit) {
              XDriveCard {
                  Text("Proof of Delivery", color = TextPrimary, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                  Text("POD files: ${job.podPhotos.size}", color = TextSecondary)
                  Text("Delivery photos: ${job.deliveryPhotos.size}", color = TextSecondary)
                  Spacer(Modifier.height(10.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxWidth()) {
                      Button(
                          onClick = onCapturePodPhoto,
