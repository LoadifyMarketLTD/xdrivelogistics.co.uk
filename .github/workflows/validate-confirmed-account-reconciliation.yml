name: Validate Confirmed Account Reconciliation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260721221000_reconcile_confirmed_current_accounts.sql"
      - ".github/workflows/validate-confirmed-account-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-reconciliation:
    name: Apply reconciliation twice to production-shaped fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdrive_account_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xdrive_account_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: xdrive_account_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production-shaped account fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE SCHEMA auth;

          CREATE TABLE auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text NOT NULL UNIQUE,
            raw_user_meta_data jsonb,
            raw_app_meta_data jsonb,
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE TABLE public.profiles (
            user_id uuid PRIMARY KEY,
            role text,
            status text,
            is_driver boolean NOT NULL DEFAULT false,
            company_id uuid,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE TABLE public.onboarding_applications (
            user_id uuid PRIMARY KEY,
            email text NOT NULL,
            account_type text,
            workspace_mode text,
            owner_driver_workspace boolean,
            status text,
            current_step text,
            completion_percentage integer,
            last_activity_at timestamptz,
            payload jsonb NOT NULL DEFAULT '{}'::jsonb,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE TABLE public.company_memberships (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid,
            company_id uuid,
            role_in_company text,
            status text,
            created_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE TABLE public.drivers (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid,
            app_access boolean NOT NULL DEFAULT false,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          INSERT INTO auth.users (email, raw_user_meta_data, raw_app_meta_data)
          SELECT email, '{}'::jsonb, '{}'::jsonb
          FROM (VALUES
            ('thesbsourier@yahoo.com'),
            ('ajhcouriersltd@outlook.com'),
            ('arif52@hotmail.co.uk'),
            ('earlyriselogistics.erl@gmail.com'),
            ('maria.amariutei15@gmail.com'),
            ('usamaali5454@gmail.com'),
            ('kennykagande2@gmail.com'),
            ('arvinraj1515@gmail.com'),
            ('danielapostoae@yahoo.com'),
            ('mtlogisticsgroup555@gmail.com'),
            ('ryolimitedlogistics@outlook.com'),
            ('info@hszlogistics.co.uk'),
            ('alexa.dorobantu86@gmail.com'),
            ('tomm25cowper@gmail.com'),
            ('logistics@navson.com'),
            ('dola-9491@outlook.com'),
            ('royhandley50@hotmail.co.uk'),
            ('dannyelbill@gmail.com'),
            ('dannyelbill447@gmail.com'),
            ('dannycourierltd@gmail.com'),
            ('angelicatoda@gmail.com'),
            ('fleserdumitru@gmail.com'),
            ('loadifymarket.co.uk@gmail.com'),
            ('xdrivelogisticsltd@gmail.com')
          ) AS fixture(email);

          INSERT INTO public.profiles (user_id, role, status, is_driver)
          SELECT
            id,
            CASE
              WHEN email IN ('mtlogisticsgroup555@gmail.com', 'ryolimitedlogistics@outlook.com') THEN 'admin'
              WHEN email = 'info@hszlogistics.co.uk' THEN 'company_admin'
              WHEN email = 'alexa.dorobantu86@gmail.com' THEN 'driver'
              WHEN email IN ('tomm25cowper@gmail.com', 'logistics@navson.com') THEN 'customer'
              WHEN email = 'dola-9491@outlook.com' THEN 'owner'
              WHEN email = 'royhandley50@hotmail.co.uk' THEN 'company_admin'
              WHEN email = 'xdrivelogisticsltd@gmail.com' THEN 'owner'
              ELSE 'driver'
            END,
            'active',
            email NOT IN (
              'mtlogisticsgroup555@gmail.com',
              'ryolimitedlogistics@outlook.com',
              'info@hszlogistics.co.uk',
              'tomm25cowper@gmail.com',
              'logistics@navson.com',
              'dola-9491@outlook.com',
              'royhandley50@hotmail.co.uk',
              'xdrivelogisticsltd@gmail.com'
            )
          FROM auth.users;

          INSERT INTO public.onboarding_applications (
            user_id, email, account_type, workspace_mode,
            owner_driver_workspace, status, current_step,
            completion_percentage, last_activity_at, payload
          )
          SELECT id, email, 'owner_driver', 'owner_driver', true,
                 'in_progress', 'account_type_wizard', 60, now(), '{"keep":"maria-payload"}'::jsonb
          FROM auth.users WHERE email = 'maria.amariutei15@gmail.com';

          INSERT INTO public.onboarding_applications (
            user_id, email, account_type, workspace_mode,
            owner_driver_workspace, status, current_step,
            completion_percentage, last_activity_at, payload
          )
          SELECT id, email, 'owner_driver', 'owner_driver', true,
                 'approved', 'identity_documents', 40, now(), '{"keep":"arvin-payload"}'::jsonb
          FROM auth.users WHERE email = 'arvinraj1515@gmail.com';

          INSERT INTO public.onboarding_applications (
            user_id, email, account_type, workspace_mode,
            owner_driver_workspace, status, current_step,
            completion_percentage, last_activity_at, payload
          )
          SELECT id, email, 'customer_shipper', 'customer', false,
                 'in_progress', 'workspace_ready', 100, now(), '{"keep":"tom-payload"}'::jsonb
          FROM auth.users WHERE email = 'tomm25cowper@gmail.com';

          INSERT INTO public.onboarding_applications (
            user_id, email, account_type, workspace_mode,
            owner_driver_workspace, status, current_step,
            completion_percentage, last_activity_at, payload
          )
          SELECT id, email, 'owner_driver', 'owner_driver', true,
                 'draft', 'account_type_wizard', 5, now(), '{"keep":"alexa-payload"}'::jsonb
          FROM auth.users WHERE email = 'alexa.dorobantu86@gmail.com';

          INSERT INTO public.drivers (user_id, app_access)
          SELECT id, true
          FROM auth.users
          WHERE email IN ('arvinraj1515@gmail.com', 'alexa.dorobantu86@gmail.com');
          SQL

      - name: Apply reconciliation twice
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260721221000_reconcile_confirmed_current_accounts.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260721221000_reconcile_confirmed_current_accounts.sql

      - name: Verify account postconditions and non-destructive behaviour
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            internal_count integer;
          BEGIN
            SELECT count(*) INTO internal_count
            FROM public.profiles p
            JOIN auth.users u ON u.id = p.user_id
            WHERE lower(u.email) IN (
              'dannyelbill@gmail.com',
              'dannyelbill447@gmail.com',
              'dannycourierltd@gmail.com',
              'angelicatoda@gmail.com',
              'fleserdumitru@gmail.com',
              'loadifymarket.co.uk@gmail.com',
              'xdrivelogisticsltd@gmail.com'
            )
              AND p.is_internal_account;
            IF internal_count <> 7 THEN
              RAISE EXCEPTION 'Expected 7 internal accounts, found %', internal_count;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM auth.users u
              JOIN public.profiles p ON p.user_id = u.id
              JOIN public.onboarding_applications oa ON oa.user_id = u.id
              WHERE u.email = 'logistics@navson.com'
                AND p.role = 'customer'
                AND NOT p.is_driver
                AND oa.account_type = 'customer_shipper'
                AND oa.status = 'approved'
                AND oa.completion_percentage = 100
            ) THEN
              RAISE EXCEPTION 'Navson was not preserved as an approved customer.';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM auth.users u
              JOIN public.profiles p ON p.user_id = u.id
              JOIN public.onboarding_applications oa ON oa.user_id = u.id
              WHERE u.email = 'alexa.dorobantu86@gmail.com'
                AND p.role = 'company_admin'
                AND NOT p.is_driver
                AND oa.account_type = 'fleet_courier'
                AND oa.status <> 'approved'
                AND oa.payload->>'keep' = 'alexa-payload'
            ) THEN
              RAISE EXCEPTION 'Alexa was not safely moved to Fleet onboarding.';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM auth.users u
              JOIN public.onboarding_applications oa ON oa.user_id = u.id
              JOIN public.drivers d ON d.user_id = u.id
              WHERE u.email = 'arvinraj1515@gmail.com'
                AND oa.status = 'in_progress'
                AND oa.completion_percentage = 40
                AND NOT d.app_access
                AND oa.payload->>'keep' = 'arvin-payload'
            ) THEN
              RAISE EXCEPTION 'Arvin incomplete approval was not restricted safely.';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM auth.users u
              JOIN public.onboarding_applications oa ON oa.user_id = u.id
              WHERE u.email = 'tomm25cowper@gmail.com'
                AND oa.status = 'approved'
                AND oa.completion_percentage = 100
                AND oa.payload->>'keep' = 'tom-payload'
            ) THEN
              RAISE EXCEPTION 'Tom customer completion was not reconciled.';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM auth.users u
              JOIN public.profiles p ON p.user_id = u.id
              WHERE u.email = 'dola-9491@outlook.com'
                AND p.role = 'owner'
                AND NOT p.is_internal_account
            ) OR NOT EXISTS (
              SELECT 1 FROM auth.users u
              JOIN public.profiles p ON p.user_id = u.id
              WHERE u.email = 'royhandley50@hotmail.co.uk'
                AND p.role = 'company_admin'
                AND NOT p.is_internal_account
            ) THEN
              RAISE EXCEPTION 'Excluded Dola or Roy account was modified.';
            END IF;

            IF (SELECT count(*) FROM public.account_reconciliation_confirmed_20260721_snapshot) <> 22 THEN
              RAISE EXCEPTION 'Snapshot did not capture all intended existing identities.';
            END IF;
          END;
          $$;
          SQL
