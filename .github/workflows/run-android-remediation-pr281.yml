name: Controlled Android Remediation PR 281

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 281 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/android-driver-tracking-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-driver-tracking-only
          fetch-depth: 0

      - name: Execute prepared atomic remediation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-android-remediation.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'run: |') + 1
          script_lines = source[start:]
          nonempty = [line for line in script_lines if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in nonempty)
          script = '\n'.join(line[indent:] if line.strip() else '' for line in script_lines) + '\n'

          diagnostic_function = '\n'.join([
              'replacement_counter = 0',
              '',
              'def replace_once(path: str, old: str, new: str) -> None:',
              '    global replacement_counter',
              '    replacement_counter += 1',
              '    print(f"APPLY #{replacement_counter}: {path} :: {old.strip().splitlines()[0][:100]}", flush=True)',
              '    if path.endswith("ApiClient.kt") and old.strip().startswith(chr(34) + "arrived_pickup" + chr(34)):',
              '        file = Path(path)',
              '        text = file.read_text()',
              '        canonical_old = "\\n".join([',
              '            "            \\"arrived_pickup\\" -> \\"on_site_pickup\\"",',
              '            "            \\"loaded\\" -> \\"loaded\\"",',
              '            "            \\"on_route_delivery\\", \\"arrived_delivery\\" -> \\"on_site_delivery\\"",',
              '            "            \\"delivered\\" -> \\"delivered\\"",',
              '        ]) + "\\n"',
              '        canonical_new = "\\n".join([',
              '            "            \\"arrived_pickup\\" -> \\"on_site_pickup\\"",',
              '            "            \\"on_my_way_to_pickup\\" -> \\"on_my_way\\"",',
              '            "            \\"loaded\\" -> \\"loaded\\"",',
              '            "            \\"on_route_delivery\\", \\"on_my_way_to_delivery\\" -> \\"in_transit\\"",',
              '            "            \\"arrived_delivery\\" -> \\"on_site_delivery\\"",',
              '            "            \\"delivered\\" -> \\"delivered\\"",',
              '        ]) + "\\n"',
              '        count = text.count(canonical_old)',
              '        if count != 1:',
              '            raise SystemExit(f"Structural canonical status replacement expected one match, found {count}")',
              '        file.write_text(text.replace(canonical_old, canonical_new, 1))',
              '        return',
              '    if path.endswith("MainActivity.kt") and old.strip().startswith("val locationPermissionLauncher"):',
              '        file = Path(path)',
              '        text = file.read_text()',
              '        begin_marker = "                val locationPermissionLauncher = rememberLauncherForActivityResult("',
              '        end_marker = "\\n\\n                val podPickerLauncher"',
              '        begin = text.find(begin_marker)',
              '        end = text.find(end_marker, begin)',
              '        if begin < 0 or end < 0:',
              '            raise SystemExit("Could not locate the location-permission callback boundaries.")',
              '        replacement = "\\n".join([',
              '            "                val locationPermissionLauncher = rememberLauncherForActivityResult(",',
              '            "                    contract = ActivityResultContracts.RequestMultiplePermissions()",',
              '            "                ) { granted ->",',
              '            "                    val hasLocation = granted[Manifest.permission.ACCESS_FINE_LOCATION] == true ||",',
              '            "                        granted[Manifest.permission.ACCESS_COARSE_LOCATION] == true ||",',
              '            "                        hasForegroundLocationPermission()",',
              '            "",',
              '            "                    if (hasLocation && startTrackingAfterPermission) {",',
              '            "                        ContextCompat.startForegroundService(",',
              '            "                            this,",',
              '            "                            Intent(this, TrackingService::class.java),",',
              '            "                        )",',
              '            "                    } else if (hasLocation) {",',
              '            "                        fusedClient.lastLocation.addOnSuccessListener { location ->",',
              '            "                            if (location != null) viewModel.sendLocation(location.latitude, location.longitude)",',
              '            "                        }",',
              '            "                    }",',
              '            "                    startTrackingAfterPermission = false",',
              '            "                }",',
              '        ])',
              '        file.write_text(text[:begin] + replacement + text[end:])',
              '        return',
              '    if path.endswith("MainActivity.kt") and old.strip().startswith("onStartTracking ="):',
              '        file = Path(path)',
              '        text = file.read_text()',
              '        begin_marker = "                            onStartTracking = {"',
              '        end_marker = "                            onStopTracking = {"',
              '        begin = text.find(begin_marker)',
              '        end = text.find(end_marker, begin)',
              '        if begin < 0 or end < 0:',
              '            raise SystemExit("Could not locate onStartTracking boundaries.")',
              '        replacement = "\\n".join([',
              '            "                            onStartTracking = {",',
              '            "                                if (hasForegroundLocationPermission()) {",',
              '            "                                    ContextCompat.startForegroundService(",',
              '            "                                        this,",',
              '            "                                        Intent(this, TrackingService::class.java),",',
              '            "                                    )",',
              '            "                                } else {",',
              '            "                                    startTrackingAfterPermission = true",',
              '            "                                    locationPermissionLauncher.launch(trackingRuntimePermissions())",',
              '            "                                }",',
              '            "                            },",',
              '        ]) + "\\n"',
              '        file.write_text(text[:begin] + replacement + text[end:])',
              '        return',
              '    if path.endswith("MainActivity.kt") and old.strip().startswith("onPublishLocation ="):',
              '        file = Path(path)',
              '        text = file.read_text()',
              '        begin_marker = "                            onPublishLocation = {"',
              '        end_marker = "                            onPickPodFile = {"',
              '        begin = text.find(begin_marker)',
              '        end = text.find(end_marker, begin)',
              '        if begin < 0 or end < 0:',
              '            raise SystemExit("Could not locate onPublishLocation boundaries.")',
              '        replacement = "\\n".join([',
              '            "                            onPublishLocation = {",',
              '            "                                startTrackingAfterPermission = false",',
              '            "                                if (hasForegroundLocationPermission()) {",',
              '            "                                    fusedClient.lastLocation.addOnSuccessListener { location ->",',
              '            "                                        if (location != null) viewModel.sendLocation(location.latitude, location.longitude)",',
              '            "                                    }",',
              '            "                                } else {",',
              '            "                                    locationPermissionLauncher.launch(trackingRuntimePermissions(includeNotifications = false))",',
              '            "                                }",',
              '            "                            },",',
              '        ]) + "\\n"',
              '        file.write_text(text[:begin] + replacement + text[end:])',
              '        return',
          ]) + '\n'

          script = script.replace(
              'def replace_once(path: str, old: str, new: str) -> None:\n',
              diagnostic_function,
              1,
          )
          script = script.replace(
              'raise SystemExit(f"Expected exactly one match in {path}, found {count}")',
              'raise SystemExit(f"Replacement #{replacement_counter} expected exactly one match in {path}, found {count}. Old prefix={old[:240]!r}")',
              1,
          )
          Path('/tmp/apply-android-remediation.sh').write_text(script)
          PY
          chmod +x /tmp/apply-android-remediation.sh

          set +e
          /tmp/apply-android-remediation.sh 2>&1 | tee /tmp/android-remediation.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            diagnostic="$(tail -n 20 /tmp/android-remediation.log)"
            body="$(printf '## Android remediation diagnostic\n\n```text\n%s\n```' "$diagnostic")"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -X PATCH -f body="$body"
            exit "$status"
          fi
