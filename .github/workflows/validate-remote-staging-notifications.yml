name: Validate Remote Staging Notifications

on:
  workflow_dispatch:
  push:
    branches:
      - agent/staging-integration
    paths:
      - "scripts/validate_remote_staging_notifications.mjs"
      - "supabase/functions/notify-operational-event/**"
      - "supabase/functions/notification-provider-test-double/**"
      - "supabase/migrations/20260721143000_notification_claim_retry_idempotency.sql"
      - "supabase/migrations/20260721143500_notification_vault_configuration_rpc.sql"
      - "supabase/migrations/20260721145000_notification_manual_dispatch_guard.sql"
      - ".github/workflows/validate-remote-staging-notifications.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: validate-remote-staging-notifications
  cancel-in-progress: false

jobs:
  notification-delivery:
    name: Webhook auth, atomic claim, provider idempotency and retry
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_STAGING_PROJECT_REF: svfjlhljuizckzabtewx
      SUPABASE_CLI_VERSION: "2.84.2"

    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Guard disposable staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/staging-integration"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_STAGING_PROJECT_REF"
          echo "Notification provider validation is restricted to disposable staging."

      - name: Resolve disposable project API keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --output /tmp/supabase-api-keys.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          keys = json.loads(Path('/tmp/supabase-api-keys.json').read_text(encoding='utf-8'))

          def find_key(*, names=(), types=()):
              for item in keys:
                  if item.get('name') in names and item.get('api_key'):
                      return item['api_key']
              for item in keys:
                  if item.get('type') in types and item.get('api_key'):
                      return item['api_key']
              return None

          public_key = find_key(names=('anon',), types=('publishable',))
          secret_key = find_key(names=('service_role',), types=('secret',))
          if not public_key or not secret_key:
              raise SystemExit('Required disposable staging API keys were unavailable.')

          print(f'::add-mask::{public_key}')
          print(f'::add-mask::{secret_key}')
          url = f'https://{os.environ["SUPABASE_PROJECT_REF"]}.supabase.co'
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'STAGING_SUPABASE_URL={url}\n')
              handle.write(f'STAGING_SUPABASE_PUBLIC_KEY={public_key}\n')
              handle.write(f'STAGING_SUPABASE_SECRET_KEY={secret_key}\n')
              handle.write(f'STAGING_NOTIFICATION_FUNCTION_URL={url}/functions/v1/notify-operational-event\n')
          PY

          rm -f /tmp/supabase-api-keys.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application and pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save "supabase@${SUPABASE_CLI_VERSION}"
          npx supabase --version | tee /tmp/supabase-cli-version.txt
          grep -Fx "$SUPABASE_CLI_VERSION" /tmp/supabase-cli-version.txt

      - name: Generate isolated staging webhook secret
        shell: bash
        run: |
          set -euo pipefail
          webhook_secret=$(openssl rand -hex 32)
          echo "::add-mask::${webhook_secret}"
          echo "STAGING_NOTIFICATION_WEBHOOK_SECRET=${webhook_secret}" >> "$GITHUB_ENV"

      - name: Deploy staging notification provider double
        shell: bash
        run: |
          set -euo pipefail
          npx supabase functions deploy notification-provider-test-double \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Configure and deploy authenticated notification worker
        shell: bash
        run: |
          set -euo pipefail
          provider_url="${STAGING_SUPABASE_URL}/functions/v1/notification-provider-test-double"
          npx supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            RESEND_API_KEY="staging-notification-provider-key" \
            RESEND_API_URL="$provider_url" \
            XDRIVE_NOTIFICATION_WEBHOOK_SECRET="$STAGING_NOTIFICATION_WEBHOOK_SECRET" \
            SITE_URL="https://www.xdrivelogistics.co.uk" \
            FROM_EMAIL="staging-notifications@xdrivelogistics.co.uk"

          npx supabase functions deploy notify-operational-event \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Wait for current notification schema and configure Vault
        shell: bash
        run: |
          set -euo pipefail
          request_body=$(python - <<'PY'
          import json
          import os
          print(json.dumps({
              'p_project_url': os.environ['STAGING_SUPABASE_URL'],
              'p_webhook_secret': os.environ['STAGING_NOTIFICATION_WEBHOOK_SECRET'],
          }))
          PY
          )

          for attempt in $(seq 1 90); do
            status=$(curl --silent --show-error \
              --output /tmp/configure-notification-vault-response.txt \
              --write-out '%{http_code}' \
              --request POST \
              "${STAGING_SUPABASE_URL}/rest/v1/rpc/configure_notification_dispatch_vault" \
              --header "apikey: ${STAGING_SUPABASE_SECRET_KEY}" \
              --header "Authorization: Bearer ${STAGING_SUPABASE_SECRET_KEY}" \
              --header "Content-Type: application/json" \
              --data "$request_body" || true)

            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "Notification schema and Vault configuration are ready."
              exit 0
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "Notification schema did not become ready. Last HTTP status: $status"
              cat /tmp/configure-notification-vault-response.txt
              exit 1
            fi
            sleep 2
          done

      - name: Validate notification script syntax
        run: node --check scripts/validate_remote_staging_notifications.mjs

      - name: Run authenticated notification delivery matrix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_remote_staging_notifications.mjs \
            2>&1 | tee /tmp/staging-notification-validation.log

      - name: Publish notification validation success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -f body="<!-- remote-staging-notification-validation-success -->
          ### Authenticated notification delivery matrix passed

          Commit: \`${GITHUB_SHA}\`
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Verified on disposable staging with an isolated provider double: webhook authentication; exact-event atomic claim under ten concurrent requests; provider Idempotency-Key enforcement; duplicate queue-key rejection; scheduled backoff; five-attempt dead-letter handling; stale-worker recovery; onboarding-secret scrubbing; and automatic database-trigger → Vault → Edge Function → provider delivery. No real customer e-mail was sent and production was not targeted."

      - name: Publish concise notification validation failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '<!-- remote-staging-notification-validation-failure -->'
            echo '### Authenticated notification delivery validation failed'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            if [ -f /tmp/staging-notification-validation.log ]; then
              grep -E 'STAGING_NOTIFICATION_VALIDATION_FAILED|returned [0-9]+|Failed to|did not|not |dead_letter|claimed|attempt' \
                /tmp/staging-notification-validation.log | tail -n 45 \
                || tail -n 55 /tmp/staging-notification-validation.log
            elif [ -f /tmp/configure-notification-vault-response.txt ]; then
              cat /tmp/configure-notification-vault-response.txt
            else
              echo 'The workflow failed before a notification validation log was created.'
            fi
            echo '```'
          } > /tmp/notification-validation-diagnostic.md

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -F body=@/tmp/notification-validation-diagnostic.md

      - name: Upload non-secret notification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-staging-notification-validation
          path: |
            /tmp/supabase-cli-version.txt
            /tmp/staging-notification-validation.log
            /tmp/configure-notification-vault-response.txt
          if-no-files-found: ignore
          retention-days: 7
