name: Patch onboarding workspace columns

on:
  push:
    branches:
      - agent/staging-integration
    paths:
      - ".github/workflows/patch-onboarding-workspace-columns.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-integration
          fetch-depth: 0

      - name: Add canonical workspace columns and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260720175000_fix_onboarding_compliance_column_alignment.sql')
          text = path.read_text(encoding='utf-8')
          marker = 'BEGIN;\n\n'
          patch = """BEGIN;

-- Clean installations do not inherit these live-era workspace selectors from
-- auth metadata. Materialize them before validating the audited onboarding
-- shape so both clean and legacy environments converge on the same schema.
ALTER TABLE public.onboarding_applications
  ADD COLUMN IF NOT EXISTS workspace_mode text,
  ADD COLUMN IF NOT EXISTS owner_driver_workspace boolean NOT NULL DEFAULT false;

UPDATE public.onboarding_applications
SET
  workspace_mode = COALESCE(
    NULLIF(workspace_mode, ''),
    CASE account_type
      WHEN 'owner_driver' THEN 'owner_driver'
      WHEN 'fleet_courier' THEN 'company'
      WHEN 'broker_shipper' THEN 'broker'
      WHEN 'customer_shipper' THEN 'customer'
      ELSE NULL
    END
  ),
  owner_driver_workspace = owner_driver_workspace OR account_type = 'owner_driver';

"""

          if 'ADD COLUMN IF NOT EXISTS workspace_mode text' not in text:
              if marker not in text:
                  raise SystemExit('Expected BEGIN marker was not found')
              text = text.replace(marker, patch, 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/patch-onboarding-workspace-columns.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260720175000_fix_onboarding_compliance_column_alignment.sql
          git add -u .github/workflows/patch-onboarding-workspace-columns.yml
          git commit -m "fix(db): materialize onboarding workspace columns"
          git push origin HEAD:agent/staging-integration
