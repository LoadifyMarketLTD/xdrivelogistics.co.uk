                    path: |
                      android-native/app/build/outputs/apk/debug/app-debug.apk
                      android-native/app-debug.apk.sha256
                    if-no-files-found: error
                    retention-days: 14

            instrumented:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"
                    cache: gradle
                - uses: android-actions/setup-android@v3
                - name: Enable KVM
                  run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm
                - name: Run Android 14 emulator tests
                  uses: reactivecircus/android-emulator-runner@v2
                  with:
                    api-level: 34
                    arch: x86_64
                    profile: pixel_6
                    disable-animations: true
                    script: cd android-native && chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
          EOF

          git config user.name "xdrive-automation"
          git config user.email "actions@users.noreply.github.com"
          git add android-native .github/workflows/android-native-ci.yml
          git commit -m "Complete Android driver execution, proof and tracking flow"
          git push origin HEAD:fix/android-driver-tracking-only
