name: Apply role workspace follow-up

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - '.github/workflows/apply-role-followup.yml'
      - '.role-followup/**'
  push:
    branches:
      - feature/role-workspaces-rebuild-2026-07-20
    paths:
      - '.github/workflows/apply-role-followup.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-role-workspace-followup
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/role-workspaces-rebuild-2026-07-20
          fetch-depth: 0

      - name: Reconstruct and apply package
        shell: bash
        run: |
          set -euo pipefail
          cat .role-followup/part* | base64 --decode > /tmp/role-followup.tar.xz
          tar -xJf /tmp/role-followup.tar.xz -C .
          python .apply-role-followup/apply_patches.py
          rm -rf .role-followup .apply-role-followup
          rm -f .github/workflows/apply-role-followup.yml

      - name: Commit functional completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete role workspace functionality and authorization'
          git push origin HEAD:feature/role-workspaces-rebuild-2026-07-20
