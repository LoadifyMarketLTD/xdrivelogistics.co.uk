name: Diagnose P0 E2E

on:
  push:
    branches:
      - agent/platform-p0-stabilization

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[p0-e2e-output]') }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform-p0-stabilization

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Capture E2E result
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          npx playwright test e2e/public.spec.ts --project=chromium --reporter=line > diagnostics/p0-e2e.log 2>&1
          code=$?
          tail -n 240 diagnostics/p0-e2e.log > diagnostics/p0-e2e.tail
          echo "E2E_EXIT=$code" >> diagnostics/p0-e2e.tail

      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name 'xdrive-ci-diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/p0-e2e.tail
          git commit -m 'Capture P0 E2E output [p0-e2e-output]' || exit 0
          git push origin HEAD:agent/platform-p0-stabilization
