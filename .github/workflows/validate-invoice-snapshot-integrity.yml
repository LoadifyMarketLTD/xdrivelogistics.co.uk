name: Validate Invoice Snapshot Integrity

on:
  pull_request:
    paths:
      - "supabase/migrations/20260723111500_invoice_snapshot_integrity.sql"
      - "app/api/finance/invoices/[id]/route.ts"
      - "app/api/finance/invoice-document-url/route.ts"
      - ".github/workflows/validate-invoice-snapshot-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoice-snapshot-integrity:
    name: Repair malformed snapshot and enforce delivery gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xdrive_invoice_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xdrive_invoice_integrity"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: xdrive_invoice_integrity

    steps:
      - name: Checkout exact pull request SHA
        uses: actions/checkout@v5

      - name: Create invoice lifecycle fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY DEFAULT gen_random_uuid());
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;

          CREATE TYPE public.invoice_status AS ENUM (
            'Pending', 'Submitted', 'Approved', 'Paid', 'Overdue', 'Disputed'
          );

          CREATE TABLE public.companies (
            id uuid PRIMARY KEY,
            name text NOT NULL,
            email text
          );

          CREATE TABLE public.jobs (
            id uuid PRIMARY KEY,
            company_id uuid NOT NULL REFERENCES public.companies(id),
            awarded_carrier_company_id uuid REFERENCES public.companies(id),
            created_by uuid,
            client_name text,
            client_email text,
            pickup_location text,
            pickup_datetime timestamptz,
            delivery_location text,
            delivery_datetime timestamptz,
            load_details text,
            customer_reference text,
            currency text DEFAULT 'GBP',
            updated_at timestamptz DEFAULT now()
          );

          CREATE TABLE public.job_bids (
            id uuid PRIMARY KEY,
            job_id uuid NOT NULL REFERENCES public.jobs(id),
            company_id uuid REFERENCES public.companies(id),
            status text NOT NULL,
            amount numeric(12,2),
            currency text,
            created_at timestamptz DEFAULT now()
          );

          CREATE TABLE public.job_commercial_agreements (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            job_id uuid NOT NULL REFERENCES public.jobs(id),
            bid_id uuid NOT NULL REFERENCES public.job_bids(id),
            buyer_company_id uuid NOT NULL REFERENCES public.companies(id),
            supplier_company_id uuid NOT NULL REFERENCES public.companies(id),
            agreed_amount numeric(12,2) NOT NULL CHECK (agreed_amount > 0),
            currency text NOT NULL DEFAULT 'GBP',
            agreed_at timestamptz NOT NULL DEFAULT now(),
            created_by uuid,
            vat_rate smallint NOT NULL DEFAULT 20,
            vat_amount numeric(12,2) NOT NULL DEFAULT 45,
            agreed_gross_amount numeric(12,2) NOT NULL DEFAULT 270,
            payment_terms text NOT NULL DEFAULT '14 days',
            payment_due_days integer NOT NULL DEFAULT 14,
            pod_required boolean NOT NULL DEFAULT true,
            agreement_status text NOT NULL DEFAULT 'accepted',
            accepted_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE UNIQUE INDEX job_commercial_agreements_job_unique
            ON public.job_commercial_agreements(job_id);

          CREATE TABLE public.invoices (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            company_id uuid NOT NULL REFERENCES public.companies(id),
            created_by uuid,
            invoice_number text NOT NULL,
            job_ref text NOT NULL,
            job_id uuid REFERENCES public.jobs(id),
            invoice_date date NOT NULL DEFAULT current_date,
            due_date date NOT NULL,
            status public.invoice_status NOT NULL DEFAULT 'Pending',
            client_name text NOT NULL,
            client_address text,
            client_email text,
            pickup_location text,
            pickup_datetime timestamptz,
            delivery_location text,
            delivery_datetime timestamptz,
            delivery_recipient text,
            service_description text,
            amount numeric NOT NULL DEFAULT 0,
            net_amount numeric NOT NULL DEFAULT 0,
            vat_amount numeric NOT NULL DEFAULT 0,
            vat_rate smallint NOT NULL DEFAULT 0,
            currency text NOT NULL DEFAULT 'GBP',
            payment_terms text NOT NULL DEFAULT '14 days',
            payment_status text NOT NULL DEFAULT 'unpaid',
            commercial_agreement_id uuid REFERENCES public.job_commercial_agreements(id),
            buyer_company_id uuid REFERENCES public.companies(id),
            supplier_company_id uuid REFERENCES public.companies(id),
            invoice_origin text,
            submitted_at timestamptz,
            submitted_by uuid,
            delivery_provider text,
            delivery_message_id text,
            delivery_recipient_email text,
            delivery_error text,
            delivery_attempted_at timestamptz,
            delivery_state text NOT NULL DEFAULT 'idle',
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          ALTER TABLE public.invoices ENABLE ROW LEVEL SECURITY;

          CREATE TABLE public.invoice_documents (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            invoice_id uuid NOT NULL REFERENCES public.invoices(id),
            company_id uuid NOT NULL REFERENCES public.companies(id),
            doc_type text NOT NULL,
            file_url text NOT NULL
          );

          CREATE FUNCTION public.is_company_member(uuid)
          RETURNS boolean LANGUAGE sql STABLE AS $$ SELECT true $$;

          CREATE TABLE public.invoice_status_history (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            invoice_id uuid NOT NULL REFERENCES public.invoices(id),
            company_id uuid NOT NULL REFERENCES public.companies(id),
            from_status public.invoice_status,
            to_status public.invoice_status NOT NULL,
            changed_by uuid,
            note text,
            changed_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE FUNCTION public.fn_log_invoice_status_change()
          RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
          CREATE TRIGGER trg_invoice_status_history_insert
            AFTER INSERT ON public.invoices FOR EACH ROW
            EXECUTE FUNCTION public.fn_log_invoice_status_change();
          CREATE TRIGGER trg_invoice_status_history_update
            AFTER UPDATE OF status ON public.invoices FOR EACH ROW
            EXECUTE FUNCTION public.fn_log_invoice_status_change();

          DO $$
          DECLARE
            buyer_id uuid := '00000000-0000-0000-0000-000000000001';
            carrier_id uuid := '00000000-0000-0000-0000-000000000002';
            job_id uuid := '00000000-0000-0000-0000-000000000003';
            bid_id uuid := '00000000-0000-0000-0000-000000000004';
            agreement_id uuid := '00000000-0000-0000-0000-000000000005';
          BEGIN
            INSERT INTO public.companies(id, name, email) VALUES
              (buyer_id, 'Loadify Market', 'loadifymarket@example.test'),
              (carrier_id, 'Carrier Ltd', 'carrier@example.test');

            INSERT INTO public.jobs(
              id, company_id, awarded_carrier_company_id, client_name, client_email,
              pickup_location, delivery_location, load_details, customer_reference, currency
            ) VALUES (
              job_id, buyer_id, carrier_id, 'Loadify Market', 'loadifymarket@example.test',
              'BB1 9QL', 'DA8 1NY', 'Transport service', 'JOB-TEST-001', 'GBP'
            );

            INSERT INTO public.job_bids(id, job_id, company_id, status, amount, currency)
            VALUES (bid_id, job_id, carrier_id, 'accepted', 225, 'GBP');

            INSERT INTO public.job_commercial_agreements(
              id, job_id, bid_id, buyer_company_id, supplier_company_id,
              agreed_amount, currency, vat_rate, vat_amount, agreed_gross_amount,
              payment_terms, payment_due_days
            ) VALUES (
              agreement_id, job_id, bid_id, buyer_id, carrier_id,
              225, 'GBP', 20, 45, 270, '14 days', 14
            );

            INSERT INTO public.invoices(
              id, company_id, invoice_number, job_ref, job_id, due_date, status,
              client_name, amount, net_amount, vat_amount, vat_rate, currency,
              commercial_agreement_id, buyer_company_id, supplier_company_id,
              invoice_origin, delivery_state
            ) VALUES (
              '00000000-0000-0000-0000-000000000006', carrier_id, 'XDR-01001', 'XDR-01001',
              job_id, current_date + 14, 'Submitted', '', 0, 0, 0, 0, 'GBP',
              NULL, NULL, NULL, 'manual', 'idle'
            );
          END $$;
          SQL

      - name: Apply integrity migration twice
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260723111500_invoice_snapshot_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260723111500_invoice_snapshot_integrity.sql

      - name: Verify repair and fail-closed constraints
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            repaired public.invoices%ROWTYPE;
            valid_id uuid := gen_random_uuid();
          BEGIN
            SELECT * INTO repaired
            FROM public.invoices
            WHERE invoice_number = 'XDR-01001';

            IF repaired.status::text <> 'Pending'
               OR repaired.client_name <> 'Loadify Market'
               OR repaired.amount <> 270
               OR repaired.net_amount <> 225
               OR repaired.vat_amount <> 45
               OR repaired.buyer_company_id <> '00000000-0000-0000-0000-000000000001'::uuid
               OR repaired.supplier_company_id <> '00000000-0000-0000-0000-000000000002'::uuid
               OR repaired.invoice_origin <> 'marketplace' THEN
              RAISE EXCEPTION 'Malformed invoice snapshot was not repaired correctly: %', row_to_json(repaired);
            END IF;

            BEGIN
              INSERT INTO public.invoices(
                company_id, invoice_number, job_ref, due_date, client_name,
                amount, net_amount, vat_amount, vat_rate, currency, invoice_origin
              ) VALUES (
                '00000000-0000-0000-0000-000000000002', 'INVALID-ZERO', 'INVALID-ZERO',
                current_date + 14, 'Customer', 0, 0, 0, 0, 'GBP', 'manual'
              );
              RAISE EXCEPTION 'Zero-value invoice was accepted.';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            INSERT INTO public.invoices(
              id, company_id, invoice_number, job_ref, job_id, due_date, status,
              client_name, client_email, amount, net_amount, vat_amount, vat_rate,
              currency, commercial_agreement_id, buyer_company_id,
              supplier_company_id, invoice_origin, delivery_state
            ) VALUES (
              valid_id,
              '00000000-0000-0000-0000-000000000002',
              'VALID-001', 'JOB-TEST-001',
              '00000000-0000-0000-0000-000000000003',
              current_date + 14, 'Pending', 'Loadify Market', 'loadifymarket@example.test',
              270, 225, 45, 20, 'GBP',
              '00000000-0000-0000-0000-000000000005',
              '00000000-0000-0000-0000-000000000001',
              '00000000-0000-0000-0000-000000000002',
              'marketplace', 'idle'
            );

            BEGIN
              UPDATE public.invoices
              SET status = 'Submitted'
              WHERE id = valid_id;
              RAISE EXCEPTION 'State-only invoice submit was accepted.';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            INSERT INTO public.invoice_documents(invoice_id, company_id, doc_type, file_url)
            VALUES (
              valid_id,
              '00000000-0000-0000-0000-000000000002',
              'invoice_pdf',
              'carrier/invoices/VALID-001.pdf'
            );

            UPDATE public.invoices
            SET status = 'Submitted',
                delivery_state = 'sent',
                delivery_provider = 'resend',
                delivery_message_id = 'provider-message-1',
                delivery_recipient_email = 'loadifymarket@example.test'
            WHERE id = valid_id;

            IF NOT EXISTS (
              SELECT 1 FROM public.invoices
              WHERE id = valid_id
                AND status::text = 'Submitted'
                AND delivery_state = 'sent'
                AND delivery_message_id = 'provider-message-1'
            ) THEN
              RAISE EXCEPTION 'Provider-backed Sent transition did not persist.';
            END IF;
          END $$;
          SQL
