name: XDrive Continuous Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'supabase/**'
      - 'scripts/run-automated-audit.mjs'
      - '__tests__/**'
      - 'package*.json'
      - '.github/workflows/xdrive-continuous-audit.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: xdrive-continuous-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Static, security and role audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run XDrive audit
        id: audit
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        run: npm run audit:auto
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdrive-audit-${{ github.run_id }}
          path: |
            docs/audit/automated-audit-results.json
            docs/audit/automated-audit-report.md
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update failure tracking issue
        if: steps.audit.outcome != 'success' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'XDrive continuous audit failure';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The scheduled XDrive audit failed on ${new Date().toISOString()}.\\n\\nRun: ${runUrl}\\n\\nInspect the uploaded audit artifacts and fix in a reviewed PR. No automatic production changes are permitted.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
      - name: Enforce audit result
        if: steps.audit.outcome != 'success'
        run: |
          echo 'Automated audit failed. Review uploaded evidence and fix in a separate PR.'
          exit 1
