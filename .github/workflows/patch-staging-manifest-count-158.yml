name: Patch staging manifest count 158

on:
  push:
    branches:
      - agent/staging-integration
    paths:
      - ".github/workflows/patch-staging-manifest-count-158.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-integration
          fetch-depth: 0

      - name: Update manifest expectations and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          clean = Path('.github/workflows/validate-clean-staging-bootstrap.yml')
          clean_text = clean.read_text(encoding='utf-8')
          old_tail = """          assert migrations[-6]['source'] == '20260720231500_onboarding_approval_driver_access_guard.sql'
          assert migrations[-5]['source'] == '20260720234500_canonical_driver_job_lifecycle.sql'
          assert migrations[-4]['source'] == '20260720235500_invoice_delivery_tracking.sql'
          assert migrations[-3]['source'] == '20260721000500_job_creation_idempotency.sql'
          assert migrations[-2]['source'] == '20260721001500_scrub_notification_secrets.sql'
          assert migrations[-1]['source'] == '20260721003000_fix_onboarding_membership_role_enum.sql'
"""
          new_tail = """          assert migrations[-7]['source'] == '20260720231500_onboarding_approval_driver_access_guard.sql'
          assert migrations[-6]['source'] == '20260720234500_canonical_driver_job_lifecycle.sql'
          assert migrations[-5]['source'] == '20260720235500_invoice_delivery_tracking.sql'
          assert migrations[-4]['source'] == '20260721000500_job_creation_idempotency.sql'
          assert migrations[-3]['source'] == '20260721001500_scrub_notification_secrets.sql'
          assert migrations[-2]['source'] == '20260721003000_fix_onboarding_membership_role_enum.sql'
          assert migrations[-1]['source'] == '20260721004500_fix_onboarding_review_company_id_ambiguity.sql'
"""
          if old_tail not in clean_text:
              raise SystemExit('Clean-bootstrap tail assertion block not found')
          clean.write_text(clean_text.replace(old_tail, new_tail, 1), encoding='utf-8')

          deploy = Path('.github/workflows/apply-normalized-supabase-staging.yml')
          deploy_text = deploy.read_text(encoding='utf-8')
          replacements = {
              'Apply 157 validated migrations to disposable staging': 'Apply 158 validated migrations to disposable staging',
              "assert manifest['included_count'] == 157, manifest['included_count']": "assert manifest['included_count'] == 158, manifest['included_count']",
              "assert manifest['migrations'][-1]['source'] == '20260721003000_fix_onboarding_membership_role_enum.sql'": "assert manifest['migrations'][-1]['source'] == '20260721004500_fix_onboarding_review_company_id_ambiguity.sql'",
              'Validated remote deployment manifest: 157 included, 1 production-data repair excluded.': 'Validated remote deployment manifest: 158 included, 1 production-data repair excluded.',
              'remote history matched **157 / 157**': 'remote history matched **158 / 158**',
          }
          for old, new in replacements.items():
              if old not in deploy_text:
                  raise SystemExit(f'Deployment workflow text not found: {old}')
              deploy_text = deploy_text.replace(old, new, 1)
          deploy.write_text(deploy_text, encoding='utf-8')

          Path('.github/workflows/patch-staging-manifest-count-158.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-clean-staging-bootstrap.yml
          git add .github/workflows/apply-normalized-supabase-staging.yml
          git add -u .github/workflows/patch-staging-manifest-count-158.yml
          git commit -m "ci(db): expect onboarding review repair migration"
          git push origin HEAD:agent/staging-integration
