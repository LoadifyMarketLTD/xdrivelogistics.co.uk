<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDrive Driver - Return Journey</title><link rel="stylesheet" href="styles.css"></head><body class="live-hydrate">
<main class="app-shell"><section class="phone"><header class="topbar"><a class="back" href="more.html">&#8592;</a><div class="top-title">Return Journey</div><div></div></header>
<div class="tabs"><button id="rjPublishTab" class="tab active">Publish</button><button id="rjMarketTab" class="tab">Marketplace</button><button id="rjMineTab" class="tab">My Journeys</button></div><section class="screen detail-screen">
<div id="rjPublish"><div class="panel"><div class="panel-title">Journey availability</div><label class="field-label">From</label><input id="rjFrom" class="form-input"><label class="field-label">To</label><input id="rjTo" class="form-input"><label class="post-check"><input id="rjAnywhere" type="checkbox"> Go anywhere</label>
<label class="field-label">Available from</label><input id="rjAvailableFrom" type="datetime-local" class="form-input"><label class="field-label">Available until</label><input id="rjAvailableTo" type="datetime-local" class="form-input"><label class="field-label">Vehicle type</label><input id="rjVehicle" class="form-input"><label class="field-label">Journey type</label><select id="rjKind" class="form-input"><option value="ad_hoc">Ad hoc</option><option value="regular">Regular</option></select>
<label class="field-label">Via locations (comma separated, max 8)</label><input id="rjVia" class="form-input"><label class="field-label">Body type</label><input id="rjBody" class="form-input"><label class="field-label">Weight kg</label><input id="rjWeight" type="number" class="form-input"><label class="field-label">Space units</label><input id="rjSpace" type="number" class="form-input"><label class="field-label">Notes</label><textarea id="rjNotes" class="form-input"></textarea><button id="rjPublishBtn" class="primary">Publish Return Journey</button><div id="rjPublishMsg" class="save-note"></div></div></div>
<div id="rjMarket" style="display:none"><div class="panel"><div class="panel-title">Marketplace search</div><label class="field-label">From</label><input id="rjSearchFrom" class="form-input"><label class="field-label">From radius</label><select id="rjFromRadius" class="form-input"><option>10</option><option selected>30</option><option>50</option><option>100</option><option>200</option><option>300</option></select><label class="field-label">To</label><input id="rjSearchTo" class="form-input"><label class="field-label">To radius</label><select id="rjToRadius" class="form-input"><option>10</option><option>30</option><option>50</option><option selected>100</option><option>200</option><option>300</option></select>
<label class="field-label">Date</label><select id="rjDate" class="form-input"><option value="today10">Next 10 days</option><option value="today">Today</option><option value="tomorrow">Tomorrow</option><option value="anytime">Anytime</option></select><label class="field-label">Member</label><input id="rjMember" class="form-input"><label class="field-label">Vehicle type</label><input id="rjSearchVehicle" class="form-input"><label class="field-label">Journey type</label><select id="rjSearchKind" class="form-input"><option value="all">All</option><option value="ad_hoc">Ad hoc</option><option value="regular">Regular</option></select><button id="rjSearchBtn" class="primary">Search Marketplace</button></div><div class="panel"><div class="panel-title">Matches</div><div id="rjMarketResults" class="details">Search to view return journeys.</div></div></div>
<div id="rjMine" style="display:none"><div class="panel"><div class="panel-title">My journeys</div><button id="rjRefreshMine" class="secondary">Refresh</button><div id="rjMineResults" class="details">Loading…</div></div></div>
</section><nav class="bottom-nav"><a class="nav-item" href="index.html"><span>&#8962;</span><small>Loads</small></a><a class="nav-item" href="alerts.html"><span>&#9671;</span><small>Alerts</small></a><a class="nav-item" href="quote.html"><span>&#9670;</span><small>My Quotes</small></a><a class="nav-item" href="bookings.html"><span>&#9635;</span><small>Bookings</small></a><a class="nav-item active" href="more.html"><span>&#8226;&#8226;&#8226;</span><small>More</small></a></nav></section></main>
<script src="real-data.js"></script><script src="return-journey-real.js"></script><script src="theme.js"></script></body></html>
