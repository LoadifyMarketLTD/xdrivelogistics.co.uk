<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#EEF1F5"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#292837">XDrive Driver — APPROVED BOOKINGS VISUAL BASELINE</text>
  <text x="60" y="82" font-family="Arial, sans-serif" font-size="15" fill="#555664">Do not redesign. Match hierarchy, spacing, colours, tabs, cards, route markers and CTA behaviour.</text>
  <defs>
    <style>
      .phone{fill:#292837}.page{fill:#F2F3F7}.card{fill:#FFFFFF}.head{fill:#292837}.tab{fill:#3A3949}.active{fill:#FFE66A}.blue{fill:#5199D6}.green{fill:#65C653}.muted{fill:#777684}.ink{fill:#41414F}.tiny{font:12px Arial}.small{font:14px Arial}.body{font:16px Arial}.title{font:bold 18px Arial}.white{fill:#fff}.black{fill:#111}
    </style>
  </defs>

  <!-- Phone 1: Bookings list -->
  <g transform="translate(40,120)">
    <rect class="phone" rx="30" width="340" height="610"/>
    <rect class="page" x="14" y="58" rx="22" width="312" height="520"/>
    <text x="170" y="38" text-anchor="middle" class="title white">XDrive • Bookings</text>
    <rect x="28" y="78" width="88" height="38" rx="19" class="card"/><rect x="122" y="78" width="100" height="38" rx="19" class="tab"/><rect x="228" y="78" width="88" height="38" rx="19" class="card"/>
    <text x="72" y="102" text-anchor="middle" class="small ink">Current</text><text x="172" y="102" text-anchor="middle" class="small white">Past 7 days</text><text x="272" y="102" text-anchor="middle" class="small ink">Past 14 days</text>
    <rect class="card" x="28" y="132" rx="18" width="288" height="390"/>
    <text x="44" y="164" class="title ink">BARON LOGISTICS LIMITED</text><text x="44" y="185" class="small muted">(GB 192638) • Load ID 87963681</text>
    <rect x="44" y="198" width="84" height="28" rx="7" fill="#59BE4E"/><rect x="136" y="198" width="78" height="28" rx="7" fill="#4CAD3F"/>
    <text x="86" y="217" text-anchor="middle" class="tiny white">COMPLETED</text><text x="175" y="217" text-anchor="middle" class="tiny white">SMARTPAY</text>
    <rect x="44" y="240" width="256" height="130" rx="16" fill="#FAFAFB" stroke="#E1E2E7"/>
    <rect x="60" y="257" width="30" height="30" rx="4" class="blue"/><text x="75" y="277" text-anchor="middle" class="small white">1</text><text x="100" y="274" class="title ink">PRESTON, PR1 1NR</text><text x="100" y="296" class="small muted">12:50 BST | 29 Aug</text>
    <circle cx="75" cy="326" r="16" class="blue"/><text x="75" y="331" text-anchor="middle" class="small white">2</text><text x="100" y="328" class="title ink">ST HELENS, WA11 9FS</text><text x="100" y="350" class="small muted">ASAP</text>
    <text x="44" y="398" class="body ink">25.8 miles (0h 34m)</text><text x="44" y="427" class="small muted">We will need: driver start work, photos,</text><text x="44" y="447" class="small muted">POD / CMR instructions and customer notes…</text>
    <text x="170" y="560" text-anchor="middle" class="small ink">Home   Alerts   Quotes   Bookings   More</text>
  </g>

  <!-- Phone 2: Summary -->
  <g transform="translate(430,120)">
    <rect class="phone" rx="30" width="340" height="610"/>
    <text x="170" y="38" text-anchor="middle" class="title white">XDrive • Booking Detail</text>
    <rect x="26" y="66" width="288" height="52" rx="26" class="tab"/><rect x="30" y="70" width="94" height="44" rx="22" class="active"/>
    <text x="77" y="98" text-anchor="middle" class="small black">Summary</text><text x="170" y="98" text-anchor="middle" class="small white">Stops</text><text x="263" y="98" text-anchor="middle" class="small white">Status</text>
    <rect class="card" x="26" y="136" rx="18" width="288" height="410"/>
    <text x="44" y="168" class="title ink">BARON LOGISTICS LIMITED</text><text x="44" y="190" class="small muted">Load ID 87963681</text>
    <rect x="44" y="210" width="252" height="280" rx="14" fill="#F1F1F4"/>
    <text x="58" y="238" class="small muted">NOTES</text><text x="58" y="264" class="body ink">We will need:</text><text x="58" y="288" class="small ink">• Driver to log in and press start work</text><text x="58" y="310" class="small ink">• Screenshot after loading</text><text x="58" y="332" class="small ink">• Goods-on-van + unloaded photos</text><text x="58" y="354" class="small ink">• Signed CMR for non-Amazon delivery</text><text x="58" y="376" class="small ink">• Complete all required POD steps</text><text x="58" y="410" class="small ink">At all times present yourself as coming</text><text x="58" y="432" class="small ink">from BARON LOGISTICS…</text>
  </g>

  <!-- Phone 3: Stop modal -->
  <g transform="translate(820,120)">
    <rect class="phone" rx="30" width="340" height="610"/>
    <rect class="card" x="24" y="80" rx="20" width="292" height="440"/>
    <rect x="24" y="80" width="292" height="84" rx="20" class="tab"/><rect x="44" y="104" width="34" height="34" rx="5" class="blue"/><text x="61" y="127" text-anchor="middle" class="small white">1</text><text x="92" y="127" class="title white">PRESTON, PR1 1NR</text>
    <text x="48" y="205" class="small muted">Time</text><text x="158" y="205" class="body ink">12:50 BST | 29 Aug</text>
    <line x1="48" y1="228" x2="292" y2="228" stroke="#E1E2E7"/><text x="48" y="265" class="small muted">Company</text><text x="158" y="260" class="body ink">Fylde Healthcare</text><text x="158" y="282" class="body ink">Limited</text>
    <line x1="48" y1="308" x2="292" y2="308" stroke="#E1E2E7"/><text x="48" y="346" class="small muted">Address</text><text x="158" y="346" class="body ink">PRESTON, PR1 1NR</text>
    <rect x="48" y="448" width="244" height="52" rx="14" class="active"/><text x="170" y="481" text-anchor="middle" class="title black">Close</text>
  </g>

  <!-- Phone 4: Status -->
  <g transform="translate(40,745)"><text x="0" y="0" font-family="Arial" font-size="1" fill="#EEF1F5">.</text></g>
  <g transform="translate(40,755)"/>
  <g transform="translate(40,760)"/>
  <text x="48" y="770" font-family="Arial" font-size="13" fill="#555664">Below are the remaining required reference states:</text>
  <text x="430" y="770" font-family="Arial" font-size="13" fill="#555664">Status timeline: Invoice → Delivered (POD) → On Site (Delivery) → Loaded → On Site (Collection) → On My Way to Collection.</text>
  <text x="40" y="792" font-family="Arial" font-size="13" fill="#555664">Stops state: ordered multi-stop collection/delivery rows with blue numbered markers and a green operational CTA. Summary state: attachments + Add Document + Add Image.</text>
</svg>