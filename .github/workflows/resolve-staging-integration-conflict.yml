name: Resolve staging integration conflicts

on:
  pull_request:
    branches:
      - agent/staging-integration
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-staging-integration-conflicts-sync-main
  cancel-in-progress: false

jobs:
  resolve-conflicts:
    name: Merge main with reviewed resolutions
    if: github.head_ref == 'agent/staging-integration-sync-main' && github.base_ref == 'agent/staging-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout isolated sync branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags --depth=1000 origin \
            +refs/heads/agent/staging-integration-sync-main:refs/remotes/origin/agent/staging-integration-sync-main \
            +refs/heads/main:refs/remotes/origin/main
          git checkout -q -B agent/staging-integration-sync-main origin/agent/staging-integration-sync-main

      - name: Merge main and resolve the reviewed conflict set
        shell: bash
        env:
          ACTUAL_HEAD_REF: ${{ github.head_ref }}
          ACTUAL_BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/resolve-staging-main-merge.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint merged tree
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        run: npm run lint

      - name: Typecheck merged tree
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        run: npm run typecheck

      - name: Build merged tree
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        run: npm run build

      - name: Typecheck Expo Driver
        working-directory: apps/driver-mobile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit reviewed merge on isolated sync branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git commit -m 'merge(main): resolve staging integration conflicts with reviewed manifest'
          git push origin HEAD:agent/staging-integration-sync-main
