<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XDrive Driver - Attachment</title><link rel="stylesheet" href="styles.css"><style>.attachment-screen{padding:14px 14px 28px}.attachment-card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:10px}.attachment-image{display:none;width:100%;height:auto;max-height:72vh;object-fit:contain;border-radius:10px;background:#F4F6F8}.attachment-frame{display:none;width:100%;height:72vh;border:0;border-radius:10px;background:#F4F6F8}.attachment-error{display:none;padding:18px;text-align:center;color:#667085;font-weight:700}.theme-night .attachment-card{background:#1B2737;border-color:#2B3A4F}.theme-night .attachment-image,.theme-night .attachment-frame{background:#111C2B}</style></head><body class="live-ready"><main class="app-shell"><section class="phone"><header class="topbar"><a id="attachmentBack" class="back" href="bookings.html">&#8592;</a><div id="attachmentTitle" class="top-title">Attachment</div><div></div></header><section class="screen attachment-screen"><div class="attachment-card"><img id="attachmentImage" class="attachment-image" alt="Booking attachment"><iframe id="attachmentFrame" class="attachment-frame" title="Booking attachment"></iframe><div id="attachmentError" class="attachment-error">This attachment could not be displayed.</div></div><a id="backToBooking" class="primary" href="bookings.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:12px">Back to Booking</a></section></section></main><script>(function(){'use strict';const q=new URLSearchParams(location.search),src=q.get('src')||'',type=(q.get('type')||'').toLowerCase(),ret=q.get('return')||'bookings.html',title=q.get('title')||'Attachment';document.getElementById('attachmentTitle').textContent=title;document.getElementById('attachmentBack').href=ret;document.getElementById('backToBooking').href=ret;const img=document.getElementById('attachmentImage'),frame=document.getElementById('attachmentFrame'),err=document.getElementById('attachmentError');if(!src){err.style.display='block';return}if(['jpg','jpeg','png','webp'].includes(type)){img.style.display='block';img.onload=()=>err.style.display='none';img.onerror=()=>{img.style.display='none';err.style.display='block'};img.src=src;return}frame.style.display='block';frame.onload=()=>err.style.display='none';frame.onerror=()=>{frame.style.display='none';err.style.display='block'};frame.src=src;})();</script><script src="theme.js"></script></body></html>
