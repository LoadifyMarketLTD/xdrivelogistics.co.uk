name: Validate Remote Staging Fleet Driver Invitation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/staging-integration
    paths:
      - "scripts/validate_remote_staging_fleet_driver_invitation.mjs"
      - "app/api/admin/driver-invitations/**"
      - "app/api/driver/invitations/**"
      - "lib/server/fleetDriverInvitations.ts"
      - "supabase/migrations/20260721150000_fleet_driver_invitation_compliance.sql"
      - "supabase/migrations/20260721150500_unique_company_driver_identity.sql"
      - "supabase/migrations/20260721151000_fleet_driver_invitation_atomic_review.sql"
      - "supabase/migrations/20260721151500_legacy_driver_invite_bridge.sql"
      - "supabase/migrations/20260721152000_driver_company_user_constraint.sql"
      - ".github/workflows/validate-remote-staging-fleet-driver-invitation.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: validate-remote-staging-fleet-driver-invitation
  cancel-in-progress: false

jobs:
  fleet-driver-invitation:
    name: Invite, accept, verify, approve, revoke and resend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_STAGING_PROJECT_REF: svfjlhljuizckzabtewx
      STAGING_APP_ORIGIN: http://127.0.0.1:3000
      XDRIVE_EXPOSE_STAGING_INVITATION_TOKEN: "true"

    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Guard disposable staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/staging-integration"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_STAGING_PROJECT_REF"
          echo "Fleet driver invitation validation is restricted to disposable staging."

      - name: Resolve disposable project API keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --output /tmp/supabase-api-keys.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          keys = json.loads(Path('/tmp/supabase-api-keys.json').read_text(encoding='utf-8'))

          def find_key(*, names=(), types=()):
              for item in keys:
                  if item.get('name') in names and item.get('api_key'):
                      return item['api_key']
              for item in keys:
                  if item.get('type') in types and item.get('api_key'):
                      return item['api_key']
              return None

          public_key = find_key(names=('anon',), types=('publishable',))
          secret_key = find_key(names=('service_role',), types=('secret',))
          if not public_key or not secret_key:
              raise SystemExit('Required disposable staging API keys were unavailable.')

          print(f'::add-mask::{public_key}')
          print(f'::add-mask::{secret_key}')
          url = f'https://{os.environ["SUPABASE_PROJECT_REF"]}.supabase.co'
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'STAGING_SUPABASE_URL={url}\n')
              handle.write(f'STAGING_SUPABASE_PUBLIC_KEY={public_key}\n')
              handle.write(f'STAGING_SUPABASE_SECRET_KEY={secret_key}\n')
              handle.write(f'NEXT_PUBLIC_SUPABASE_URL={url}\n')
              handle.write(f'EXPECTED_NEXT_PUBLIC_SUPABASE_URL={url}\n')
              handle.write(f'NEXT_PUBLIC_SUPABASE_ANON_KEY={public_key}\n')
              handle.write(f'SUPABASE_SERVICE_ROLE_KEY={secret_key}\n')
          PY

          rm -f /tmp/supabase-api-keys.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate invitation script syntax
        run: node --check scripts/validate_remote_staging_fleet_driver_invitation.mjs

      - name: Wait for fleet driver invitation schema
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            status=$(curl --silent --show-error \
              --output /tmp/fleet-driver-schema-response.txt \
              --write-out '%{http_code}' \
              "${STAGING_SUPABASE_URL}/rest/v1/fleet_driver_invitations?select=id&limit=1" \
              --header "apikey: ${STAGING_SUPABASE_SECRET_KEY}" \
              --header "Authorization: Bearer ${STAGING_SUPABASE_SECRET_KEY}" || true)
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "Fleet driver invitation schema is ready."
              exit 0
            fi
            if [ "$attempt" -eq 100 ]; then
              cat /tmp/fleet-driver-schema-response.txt
              exit 1
            fi
            sleep 2
          done

      - name: Build application against disposable staging
        env:
          SUPABASE_ENV_STRICT: "true"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          XDRIVE_FORCE_CANONICAL_HOST: "false"
        run: npm run build

      - name: Start staging-bound application
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          XDRIVE_FORCE_CANONICAL_HOST: "false"
          XDRIVE_EXPOSE_STAGING_INVITATION_TOKEN: "true"
        run: |
          set -euo pipefail
          npm run start > /tmp/staging-fleet-driver-app.log 2>&1 &
          echo $! > /tmp/staging-fleet-driver-app.pid

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then
              echo "Staging-bound application is ready."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/staging-fleet-driver-app.log
          exit 1

      - name: Run authenticated invited fleet driver journey
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_remote_staging_fleet_driver_invitation.mjs \
            2>&1 | tee /tmp/staging-fleet-driver-invitation.log

      - name: Publish invited fleet driver success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -f body="<!-- remote-staging-fleet-driver-invitation-success -->
          ### Invited Fleet Driver lifecycle passed

          Commit: \`${GITHUB_SHA}\`
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Verified on disposable staging only: owner-only invitation; viewer and unrelated-tenant denial; 48-hour expiry; invited membership; no app access before approval; authenticated acceptance; mandatory private document uploads; replacement without duplicates; signed admin preview; atomic approval; safe resume; revoke; resend token rotation; and expired-token denial. Production was not targeted."

      - name: Publish concise invited fleet driver failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '<!-- remote-staging-fleet-driver-invitation-failure -->'
            echo '### Invited Fleet Driver validation failed'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            if [ -f /tmp/staging-fleet-driver-invitation.log ]; then
              grep -E 'STAGING_FLEET_DRIVER_INVITATION_FAILED|returned [0-9]+|Failed to|did not|not |premature|expired|revok|resend' \
                /tmp/staging-fleet-driver-invitation.log | tail -n 50 \
                || tail -n 60 /tmp/staging-fleet-driver-invitation.log
            elif [ -f /tmp/staging-fleet-driver-app.log ]; then
              tail -n 60 /tmp/staging-fleet-driver-app.log
            elif [ -f /tmp/fleet-driver-schema-response.txt ]; then
              cat /tmp/fleet-driver-schema-response.txt
            else
              echo 'The workflow failed before a fleet driver journey log was created.'
            fi
            echo '```'
          } > /tmp/fleet-driver-diagnostic.md

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/248/comments" \
            -F body=@/tmp/fleet-driver-diagnostic.md

      - name: Upload non-secret fleet driver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-staging-fleet-driver-invitation
          path: |
            /tmp/staging-fleet-driver-app.log
            /tmp/staging-fleet-driver-invitation.log
            /tmp/fleet-driver-schema-response.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop staging-bound application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/staging-fleet-driver-app.pid ]; then
            kill "$(cat /tmp/staging-fleet-driver-app.pid)" || true
          fi
