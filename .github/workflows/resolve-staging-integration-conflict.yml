name: Resolve staging integration conflicts

on:
  pull_request:
    branches:
      - agent/staging-integration
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-staging-integration-conflicts-sync-main
  cancel-in-progress: false

jobs:
  resolve-conflicts:
    name: Merge main with reviewed resolutions
    if: github.head_ref == 'agent/staging-integration-sync-main' && github.base_ref == 'agent/staging-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout isolated sync branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/staging-integration-sync-main
          fetch-depth: 0
          show-progress: false

      - name: Merge main and resolve the reviewed conflict set
        shell: bash
        env:
          EXPECTED_HEAD_REF: agent/staging-integration-sync-main
          EXPECTED_BASE_REF: agent/staging-integration
          ACTUAL_HEAD_REF: ${{ github.head_ref }}
          ACTUAL_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error title=Staging integration merge::$1" >&2
            exit 1
          }
          require_pattern() {
            local label="$1"
            local pattern="$2"
            local file="$3"
            if ! grep -Fq -- "$pattern" "$file"; then
              fail "Missing invariant '${label}' in ${file}."
            fi
            echo "Verified invariant: ${label}"
          }

          test "${GITHUB_REPOSITORY}" = 'LoadifyMarketLTD/xdrivelogistics.co.uk' || fail 'Unexpected repository.'
          test "${ACTUAL_HEAD_REF}" = "${EXPECTED_HEAD_REF}" || fail 'Unexpected PR head branch.'
          test "${ACTUAL_BASE_REF}" = "${EXPECTED_BASE_REF}" || fail 'Unexpected PR base branch.'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet --no-tags origin main

          branch_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          echo "Branch before merge: ${branch_sha}"
          echo "Main to merge: ${main_sha}"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          echo "Merge command status: ${merge_status}"

          git rev-parse -q --verify MERGE_HEAD >/dev/null || fail "Merge did not enter a valid merge state (status=${merge_status})."

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)
          echo "Actual conflict count: ${#conflicts[@]}"
          printf 'Conflict: %s\n' "${conflicts[@]}"

          allowed=(
            '.github/workflows/ci.yml'
            'app/api/_lib/onboarding.ts'
            'app/api/driver/finance/invoices/[id]/submit/route.ts'
            'app/api/driver/mobile/_lib.ts'
            'app/api/driver/mobile/jobs/[id]/[action]/route.ts'
            'app/api/jobs/create/route.ts'
            'app/components/OnboardingAccessGuard.tsx'
            'app/onboarding/resume/page.tsx'
            'app/register/page.tsx'
            'apps/driver-mobile/src/api/jobs.ts'
            'lib/server/invoicePdf.ts'
            'supabase/functions/notify-operational-event/index.ts'
          )

          printf '%s\n' "${allowed[@]}" > /tmp/allowed-conflicts.txt
          for path in "${conflicts[@]}"; do
            grep -Fxq -- "$path" /tmp/allowed-conflicts.txt || fail "Unexpected conflict outside the reviewed manifest: ${path}"
          done

          is_unmerged() {
            git diff --name-only --diff-filter=U -- "$1" | grep -Fxq -- "$1"
          }

          ours=(
            'app/api/_lib/onboarding.ts'
            'app/api/driver/mobile/_lib.ts'
            'app/onboarding/resume/page.tsx'
            'app/register/page.tsx'
            'supabase/functions/notify-operational-event/index.ts'
          )
          theirs=(
            '.github/workflows/ci.yml'
            'app/api/driver/finance/invoices/[id]/submit/route.ts'
            'app/api/driver/mobile/jobs/[id]/[action]/route.ts'
            'app/api/jobs/create/route.ts'
            'app/components/OnboardingAccessGuard.tsx'
            'apps/driver-mobile/src/api/jobs.ts'
            'lib/server/invoicePdf.ts'
          )

          for path in "${ours[@]}"; do
            if is_unmerged "$path"; then
              echo "Resolve with reviewed integration version: ${path}"
              git checkout --ours -- "$path"
              git add -- "$path"
            fi
          done
          for path in "${theirs[@]}"; do
            if is_unmerged "$path"; then
              echo "Resolve with current main version: ${path}"
              git checkout --theirs -- "$path"
              git add -- "$path"
            fi
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            fail 'Unresolved merge entries remain.'
          fi

          require_pattern '48-hour invitation default' "fallback = Number.isFinite(envValue) && envValue > 0 ? envValue : 48" app/api/_lib/onboarding.ts
          require_pattern 'unknown account types fail closed' 'return null;' app/api/_lib/onboarding.ts
          require_pattern 'fleet driver compliance' 'fleet_driver_compliance_current' app/api/driver/mobile/_lib.ts
          require_pattern 'owner driver compliance' 'owner_driver_compliance_current' app/api/driver/mobile/_lib.ts
          require_pattern 'revoked invitation UI' 'invitationRevoked' app/onboarding/resume/page.tsx
          require_pattern 'non-customer profile remains pending' "status: signupConfig.accountType === 'customer_shipper' ? 'active' : 'pending'" app/register/page.tsx
          require_pattern 'atomic notification claim' 'claim_notification_events' supabase/functions/notify-operational-event/index.ts
          require_pattern 'provider idempotency key' 'Idempotency-Key' supabase/functions/notify-operational-event/index.ts
          require_pattern 'persistent invitation revocation' 'token_revoked_at' app/api/onboarding/init/route.ts
          require_pattern 'onboarding revoke endpoint' 'export async function DELETE' app/api/onboarding/init/route.ts

          git rm -f --ignore-unmatch -- .github/staging-merge-main.trigger
          git rm -f --ignore-unmatch -- staging-validation/main-merge-conflicts-latest.txt
          git rm -f --ignore-unmatch -- .github/workflows/resolve-staging-integration-conflict.yml

          conflict_list='none'
          if (( ${#conflicts[@]} > 0 )); then
            conflict_list="$(IFS=,; echo "${conflicts[*]}")"
          fi
          {
            printf 'branch_before=%s\n' "$branch_sha"
            printf 'main_merged=%s\n' "$main_sha"
            printf 'merge_status=%s\n' "$merge_status"
            printf 'conflict_count=%s\n' "${#conflicts[@]}"
            printf 'conflicts=%s\n' "$conflict_list"
            printf 'resolution=reviewed-subset-manifest\n'
          } > staging-validation/main-merge-latest.txt
          git add staging-validation/main-merge-latest.txt
          echo 'Reviewed merge tree prepared successfully.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint merged tree
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        run: npm run lint

      - name: Typecheck merged tree
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        run: npm run typecheck

      - name: Build merged tree
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          EXPECTED_NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        run: npm run build

      - name: Typecheck Expo Driver
        working-directory: apps/driver-mobile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit reviewed merge on isolated sync branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git commit -m 'merge(main): resolve staging integration conflicts with reviewed manifest'
          git push origin HEAD:agent/staging-integration-sync-main
